<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>나의 운동 기록</title>
<meta property="og:title" content="나의 운동 기록">
<meta property="og:description" content="수업마다 한 운동과 좋아진 기록을 모아 둔 페이지입니다">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* 회원이 보는 페이지 — 선생님 앱(수업일지)과 같은 다크 네이비 톤. 회원별 웹 링크 (2026-11-13) */
  :root{
    --bg:#0C1424; --card:#131E33; --card2:#182642; --line:#243352;
    --ink:#EAF0FA; --sub:#8FA0BC; --blue:#4D8DFF; --blue-soft:rgba(77,141,255,.14);
    --good:#3DD68C; --good-soft:rgba(61,214,140,.13);
  }
  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{color:var(--ink); font-family:'IBM Plex Sans KR',-apple-system,'Malgun Gothic',sans-serif; font-size:15px; line-height:1.55}
  #page{max-width:480px; margin:0 auto; min-height:100vh; padding:22px 16px 48px}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}
  .muted{color:var(--sub); font-size:12.5px}
  .eyebrow{color:var(--blue); font-size:12.5px; font-weight:600; letter-spacing:.02em}
  h1{font-size:24px; font-weight:700; letter-spacing:-.015em; margin-top:2px; overflow-wrap:anywhere}
  h2{font-size:15px; font-weight:700; margin:22px 0 9px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:10px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center; min-width:0}
  .stat .v{font-size:17px; font-weight:600; margin-top:1px; white-space:nowrap}
  .gain{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
  .gain:first-child{border-top:0; padding-top:2px} .gain:last-child{padding-bottom:2px}
  .gain .nm{min-width:0; overflow-wrap:anywhere}
  .pill{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:100px; background:var(--good-soft); color:var(--good); white-space:nowrap}
  .shead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:7px}
  .shead b{font-size:15.5px}
  .item{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:14px}
  .item .nm{flex-shrink:0; max-width:46%; overflow-wrap:anywhere}
  .item .rec{text-align:right; color:var(--ink); min-width:0; overflow-wrap:anywhere}
  .up{color:var(--good); font-size:11.5px; font-weight:600; white-space:nowrap; margin-left:6px}
  .hw{margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--blue-soft); font-size:13.5px; overflow-wrap:anywhere}
  .more{display:block; width:100%; padding:12px; margin-top:4px; border-radius:12px; border:1px solid var(--line); background:none; color:var(--sub); font-family:inherit; font-size:14px; cursor:pointer}
  .more:active{background:var(--card2)}
  .empty{text-align:center; color:var(--sub); padding:70px 16px; line-height:1.8}
  .foot{margin-top:26px; text-align:center; color:var(--sub); font-size:12px; line-height:1.7}
</style>
<div id="page"><div class="empty">기록을 불러오는 중…</div></div>
<script>
const FN='https://kpubgeejyiupdvbbdxwt.supabase.co/functions/v1/mpage';
const DAYS=['일','월','화','수','목','금','토'];
let shown=8, D=null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dTxt(d){ if(!d) return ''; const p=d.split('-'); if(p.length<3) return d.replace(/-/g,'.');
  const w=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return (+p[1])+'월 '+(+p[2])+'일 ('+DAYS[w]+')'; }
function ymTxt(d){ if(!d) return '-'; const p=d.split('-'); return p[0].slice(2)+'.'+p[1]; }
function show(html){ document.getElementById('page').innerHTML=html; }
function render(){
  const d=D, S=d.sessions||[];
  const stats=`<div class="stats">
      <div class="stat"><div class="muted">누적 수업</div><div class="v num">${esc(d.total||S.length)}회</div></div>
      <div class="stat"><div class="muted">${d.prog?'이번 프로그램':'최근 수업'}</div><div class="v num">${d.prog? esc(d.prog.done)+'/'+esc(d.prog.total)+'회' : esc(S[0]? (S[0].d||'').slice(5).replace('-','.') : '-')}</div></div>
      <div class="stat"><div class="muted">시작</div><div class="v num">${esc(ymTxt(d.since))}</div></div></div>`;
  const G=d.gains||[];
  const gains= G.length? `<h2>좋아진 기록</h2><div class="card">${G.map(g=>
      `<div class="gain"><span class="nm">${esc(g.nm)}<br><span class="muted">처음 ${esc(g.f)}${esc(g.u)} → <b style="color:var(--ink)">최고 ${esc(g.b)}${esc(g.u)}</b></span></span><span class="pill">+${esc(Math.round((g.b-g.f)*10)/10)}${esc(g.u)}</span></div>`).join('')}</div>
      <div class="muted" style="margin:-2px 2px 0">처음 했을 때와 지금까지의 최고 기록을 견준 값이에요</div>` : '';
  const list=S.slice(0,shown).map(s=>`<div class="card">
      <div class="shead"><b>${esc(dTxt(s.d))}</b><span class="muted">${s.n? esc(s.n)+'회차':''}</span></div>
      ${(s.it||[]).map(x=>`<div class="item"><span class="nm">${esc(x.nm)}</span><span class="rec">${esc(x.rec)}${x.up?`<span class="up">▲ ${esc(x.up)}%</span>`:''}</span></div>`).join('')}
      ${s.hw?`<div class="hw">📝 <b>숙제</b> ${esc(s.hw)}</div>`:''}</div>`).join('');
  show(`<div class="eyebrow">PT 수업 기록</div>
    <h1>${esc(d.name)}님</h1>
    <div class="muted" style="margin-top:3px">${d.trainer? esc(d.trainer)+' 선생님 · ':''}${S[0]? '마지막 수업 '+esc(dTxt(S[0].d)) : '아직 수업 기록이 없어요'}</div>
    ${stats}${gains}
    ${S.length?`<h2>수업 기록</h2>${list}`:''}
    ${S.length>shown?`<button class="more" onclick="shown+=10; render()">이전 수업 더 보기 (${S.length-shown}회 남음)</button>`:''}
    ${S.some(s=>(s.it||[]).some(x=>x.up))?'<div class="muted" style="margin:10px 2px 0">▲ 는 같은 운동의 지난 기록보다 좋아진 정도예요</div>':''}
    <div class="foot">수업이 끝나면 이 페이지가 새로 바뀝니다<br>PT 수업일지</div>`);
  document.title=(d.name||'')+'님의 운동 기록';
}
async function boot(){
  const t=new URLSearchParams(location.search).get('t')||'';
  if(!/^[A-Za-z0-9]{20,40}$/.test(t)){ show('<div class="empty">주소가 올바르지 않습니다.<br>선생님께 링크를 다시 받아 주세요.</div>'); return; }
  try{
    const res=await fetch(FN+'?t='+encodeURIComponent(t), {cache:'no-store'});
    if(res.status===404){ show('<div class="empty">이 페이지는 지금 볼 수 없습니다.<br>선생님이 링크를 껐거나 주소가 바뀌었어요.</div>'); return; }
    const out=await res.json();
    if(!res.ok||!out.data) throw new Error('서버 '+res.status);
    D=out.data; render();
  }catch(e){ show('<div class="empty">기록을 불러오지 못했습니다.<br>잠시 뒤 다시 열어 주세요.</div>'); }
}
boot();
</script>
