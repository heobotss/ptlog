<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050A16">
<title>나의 운동 기록</title>
<meta property="og:title" content="나의 운동 기록">
<meta property="og:description" content="선생님이 수업마다 적어 드리는 개인 운동 기록입니다">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 회원이 보는 페이지 — 2026-11-13 세 번째 개편(브랜드의 파란색 계열, 고급스럽게) + 판정단 네 명 반영.
     원칙: 「빛이 귀해야 비싸 보인다」
     · 입체는 둘뿐 — 맨 위 회원 카드(금속 모서리 테두리, 빛 띠는 처음 한 번만), 기념 주화(은빛 금속 고리)
     · 유리 — 묶음 판(옅은 면 + 윗변 한 줄 빛, 그림자·blur 없음)   · 평면 — 출석 칸, 부위 막대, 수업 기록, 글
     · 발광은 단계 고리 한 곳만. 재질은 무광 금속(은빛)과 사파이어 둘. 금색·젤리 광택·네온 없음
     · 글자 크기는 34 / 24 / 19 / 17 / 15 / 14 여섯 단계. 숫자는 클수록 가늘게, 단위는 숫자의 절반 크기
     · 금속 그라데이션 글자는 가장 큰 숫자 둘(수업 횟수, 연속 주)에만
     내용의 선은 그대로 — 실제 기록에서만 계산, 줄어든 기록·빠진 주는 드러내지 않는다. 가장 작은 글자 14px */
  :root{
    --bg:#050A16; --face:#0C1730; --ink:#EEF3FF; --sub:#A3B5D6; --dim:#7387AD;
    --line:rgba(170,195,240,.14); --line2:rgba(170,195,240,.26);
    --blue:#4D8DFF; --silver:#DCE7FF; --ice:#CFE0FF; --hi:#9EC4FF;
    --metal:linear-gradient(180deg,#FFFFFF 0%,#C9DAFF 100%);
    --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{color:var(--ink); font-family:var(--sans); font-weight:400; font-size:17px; line-height:1.65; word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased;
    background:radial-gradient(ellipse 130% 480px at 50% -140px, rgba(64,128,240,.14), rgba(64,128,240,0) 70%) no-repeat, var(--bg)}
  #page{max-width:480px; margin:0 auto; min-height:100vh; padding-top:16px}
  .label{font-size:14px; letter-spacing:.02em; color:var(--sub); font-weight:600}
  .note{font-size:15px; color:var(--sub); line-height:1.7}
  .gold{color:var(--hi); font-weight:700}
  i.u{font-style:normal; font-size:.52em; font-weight:500; color:var(--sub); margin-left:.12em; letter-spacing:0}

  /* 입체 — 맨 위 회원 카드 */
  .hero{position:relative; margin:0 16px; padding:26px 22px 22px; border-radius:24px; overflow:hidden; isolation:isolate; border:1px solid transparent;
    background:linear-gradient(160deg,#16306B 0%,#0B1A3E 55%,#081230 100%) padding-box,
      linear-gradient(160deg,rgba(220,232,255,.60),rgba(220,232,255,.08) 40%,rgba(220,232,255,.24)) border-box;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 1px 0 rgba(0,0,0,.6), 0 24px 48px -28px rgba(0,0,0,.9)}
  .hero:before{content:''; position:absolute; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(120% 80% at 0% 0%, rgba(120,170,255,.20), rgba(120,170,255,0) 58%)}
  .hero:after{content:''; position:absolute; top:-40%; bottom:-40%; left:-40%; width:22%; z-index:-1; pointer-events:none; transform:rotate(18deg); opacity:0;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.10) 50%, rgba(255,255,255,0)); animation:sheen 1.2s cubic-bezier(.3,.6,.2,1) .5s 1 both}
  @keyframes sheen{0%{left:-40%; opacity:1} 85%{opacity:1} 100%{left:130%; opacity:0}}
  .hero .label{color:rgba(220,232,255,.78)}
  .hair{width:28px; height:1px; background:var(--silver); opacity:.7; margin:14px 0 20px}
  .hero h1{font-weight:700; font-size:34px; letter-spacing:-.02em; line-height:1.25}
  .hero h1 small{font-size:19px; font-weight:400; margin-left:.2em; color:rgba(226,236,255,.8)}
  .hero .with{font-size:15px; color:rgba(220,232,255,.78); margin-top:8px}
  .count{display:flex; align-items:baseline; gap:10px; margin-top:32px}
  .count b{font-weight:280; font-size:108px; line-height:.86; letter-spacing:-.04em; font-variant-numeric:proportional-nums; background:var(--metal); -webkit-background-clip:text; background-clip:text; color:transparent}
  .count span{font-size:19px; font-weight:500; color:rgba(226,236,255,.86)}
  .stage{display:flex; align-items:center; gap:16px; margin-top:24px; padding-top:24px; border-top:1px solid rgba(200,220,255,.14)}
  .ring{position:relative; width:78px; height:78px; flex-shrink:0}
  .ring svg{width:78px; height:78px; transform:rotate(-90deg); overflow:visible}
  .ring .bgc{fill:none; stroke:rgba(200,220,255,.12); stroke-width:2}
  .ring .fgc{fill:none; stroke-width:3; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(110,165,255,.6)); transition:stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)}
  .ring .in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1}
  .ring .in b{font-size:26px; font-weight:400; letter-spacing:-.02em; font-variant-numeric:proportional-nums}
  .ring .in span{font-size:14px; color:rgba(220,232,255,.78); margin-top:1px}
  .stage .ttl{font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.25}
  .stage .nxt{font-size:15px; color:rgba(220,232,255,.78); margin-top:4px}
  .facts{display:grid; grid-template-columns:repeat(3,1fr); margin-top:24px; border-top:1px solid rgba(200,220,255,.14)}
  .facts div{padding:16px 0 0 12px; border-left:1px solid rgba(200,220,255,.14); min-width:0}
  .facts div:first-child{padding-left:0; border-left:0}
  .facts dt{font-size:14px; color:rgba(220,232,255,.72); line-height:1.4; white-space:nowrap; letter-spacing:-.01em}
  .facts dd{font-size:27px; font-weight:400; letter-spacing:-.02em; line-height:1.2; margin-top:4px; white-space:nowrap; font-variant-numeric:proportional-nums}
  .facts dd i{font-style:normal; font-size:14px; font-weight:500; letter-spacing:0; margin-left:3px; color:rgba(220,232,255,.78)}

  /* 평면 — 본문 */
  section{padding:0 22px; margin-top:48px}
  .sh{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding-top:13px; margin-bottom:16px; position:relative}
  .sh:before{content:''; position:absolute; left:0; right:0; top:0; height:1px; background:linear-gradient(90deg, rgba(190,212,255,.5), rgba(190,212,255,.10) 70%, rgba(190,212,255,0))}
  .lead{font-size:24px; font-weight:600; line-height:1.42; letter-spacing:-.025em}
  .row{display:flex; justify-content:space-between; align-items:baseline; gap:12px}

  /* 유리 — 묶음 판 */
  .glass{background:rgba(130,165,235,.06); border:1px solid var(--line); border-radius:18px; padding:4px 18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .glass .top:last-child, .glass .part:last-of-type, .glass .gain:last-of-type{border-bottom:0}

  /* 지난 수업 */
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:16px 0; border-bottom:1px solid var(--line)}
  .top span{font-size:19px; font-weight:600; letter-spacing:-.02em}
  .top b{font-size:28px; font-weight:400; letter-spacing:-.02em; line-height:1.15; white-space:nowrap; font-variant-numeric:proportional-nums}
  .hw{margin-top:24px; padding:2px 0 2px 16px; border-left:2px solid var(--blue)}
  .hw .label{display:block; margin-bottom:4px}

  /* 꾸준히 온 날들 */
  .bigno{font-size:76px; font-weight:300; letter-spacing:-.04em; line-height:.92; font-variant-numeric:proportional-nums}
  .bigno b{font-weight:300; background:var(--metal); -webkit-background-clip:text; background-clip:text; color:transparent}
  .bigno small{font-size:15px; font-weight:400; letter-spacing:0; margin-left:8px; color:var(--sub)}
  .weeks{display:flex; gap:5px; margin-top:24px}
  .weeks i{flex:1; aspect-ratio:1; max-width:26px; border-radius:4px; border:1px solid var(--line2)}
  .weeks i.a{background:rgba(77,141,255,.35); border-color:transparent}
  .weeks i.b{background:var(--blue); border-color:transparent; box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .weeks i.now{outline:1px solid var(--silver); outline-offset:2px}

  /* 부위별 단련 */
  .part{display:grid; grid-template-columns:52px 1fr 66px; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--line)}
  .part .nm{font-size:17px; font-weight:500}
  .part .steps{display:flex; gap:5px}
  .part .steps i{flex:1; height:3px; border-radius:2px; background:rgba(170,195,240,.16)}
  .part .steps i.on{background:#7FA8F0}
  .part.best .steps i.on{background:var(--silver)}
  .part .v{font-size:19px; font-weight:500; letter-spacing:-.02em; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
  .part .v i{font-style:normal; font-size:14px; font-weight:500; color:var(--sub); margin-left:1px; letter-spacing:0}
  .part.off .nm{color:var(--dim)} .part.off .v{color:var(--dim); font-size:14px; font-weight:400; letter-spacing:0}

  /* 처음보다 늘었습니다 */
  .gain{padding:18px 0; border-bottom:1px solid var(--line)}
  .gain .nm{font-size:19px; font-weight:600; letter-spacing:-.02em}
  .gain .up{font-size:28px; font-weight:400; letter-spacing:-.02em; line-height:1.15; white-space:nowrap; font-variant-numeric:proportional-nums}
  .trk{position:relative; height:14px; margin-top:12px}
  .trk:before{content:''; position:absolute; left:0; right:0; top:6px; height:2px; border-radius:2px; background:rgba(170,195,240,.16)}
  .trk .seg{position:absolute; right:0; top:6px; height:2px; border-radius:2px; background:linear-gradient(90deg,#4D8DFF,#CFE0FF); transform-origin:left center; transform:scaleX(0); transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
  .trk .p1,.trk .p2{position:absolute; top:2px; width:10px; height:10px; border-radius:50%; margin-left:-5px}
  .trk .p1{background:var(--face); border:1.5px solid #6E93D8}
  .trk .p2{left:auto; right:0; margin:0; background:var(--silver); box-shadow:0 0 0 3px rgba(77,141,255,.25)}

  /* 입체 — 기념 주화: 어두운 남색 면에 은빛 금속 고리, 안쪽에 각인선 한 줄 */
  .seals{display:grid; grid-template-columns:repeat(4,1fr); gap:24px 4px}
  .seal{text-align:center; min-width:0}
  .seal .c{width:68px; height:68px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.5px solid transparent;
    background:radial-gradient(circle at 50% 30%,#18294F,#0A1430 75%) padding-box, conic-gradient(from 200deg,#F2F6FF,#7E95C2,#E6EEFF,#55709F,#F2F6FF) border-box;
    box-shadow:inset 0 0 0 4px #0B1632, inset 0 0 0 5px rgba(210,225,255,.22), 0 4px 10px -5px rgba(0,0,0,.7)}
  .seal .c>span{display:flex; flex-direction:column; align-items:center; margin:0; font-size:22px; font-weight:700; letter-spacing:-.03em; line-height:1; color:var(--silver); font-variant-numeric:proportional-nums}
  .seal.sm .c>span{font-size:19px}
  .seal .c small{font-size:14px; font-weight:600; letter-spacing:.02em; color:var(--sub); margin-top:3px; line-height:1}
  .seal.new .c{background:radial-gradient(circle at 50% 28%,#2C5BC4,#1D3F8F 78%) padding-box, conic-gradient(from 200deg,#FFFFFF,#8FA6D6,#F2F6FF,#6A86BC,#FFFFFF) border-box;
    box-shadow:inset 0 0 0 4px #1D3F8F, inset 0 0 0 5px rgba(230,240,255,.35), 0 4px 10px -5px rgba(0,0,0,.7)}
  .seal.new .c>span{color:#fff} .seal.new .c small{color:var(--ice)}
  .seal.no .c{background:none; border:1px solid var(--line2); box-shadow:none}
  .seal.no .c>span{color:var(--dim); font-weight:500} .seal.no .c small{color:var(--dim)}
  .seal span{display:block; font-size:14px; font-weight:500; line-height:1.4; margin-top:10px}
  .seal em{display:block; font-style:normal; font-size:14px; color:var(--sub); line-height:1.35}
  .seal.no span{color:var(--dim); font-weight:400}

  /* 평면 — 수업 기록 */
  /* 수업 기록 — 날짜마다 한 덩어리(11-13 대표님: 글만 죽 나열되면 안 읽힌다, 날짜가 다르다는 게 보이게) */
  /* 11-13 대표님 재확인: 아직 날짜 구분이 약하다 → 테두리를 밝은 파랑으로, 덩어리 면을 바탕보다 한 단계 밝게, 날짜 띠를 파랗게, 덩어리 사이를 넓게 */
  .ses{background:#0D1A36; border:1px solid rgba(118,170,255,.62); border-radius:16px; padding:0 18px 6px; margin-bottom:20px; box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
  .ses .hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 -18px; padding:15px 18px 13px; border-bottom:1px solid rgba(118,170,255,.45); background:linear-gradient(90deg, rgba(77,141,255,.40), rgba(77,141,255,.16)); border-radius:15px 15px 0 0}
  .ses .hd .label{color:var(--ice)}
  .ses .d{font-size:19px; font-weight:700; letter-spacing:-.02em; color:#fff}
  .item{display:grid; grid-template-columns:7.2em 1fr; gap:12px; align-items:baseline; padding:12px 0; font-size:16px; border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .nm{color:var(--ink); font-weight:600}
  .item .rec{font-size:16px; line-height:1.6; color:#D6E1F6; font-variant-numeric:tabular-nums}
  .mk{font-size:14px; white-space:nowrap; margin-left:.45em}
  .mk.t{color:var(--ice); font-weight:700; background:rgba(77,141,255,.20); padding:1px 7px 2px; border-radius:6px} .mk.u{color:var(--hi)}
  .ses .hw{margin:6px 0 14px}
  .hwb{display:block; margin-top:10px; padding:10px 18px; border-radius:999px; border:1px solid rgba(118,170,255,.62); background:none; color:var(--ice); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer}
  .hwb.on{background:#4D8DFF; border-color:#4D8DFF; color:#fff}
  .hwb:active{transform:translateY(1px)}
  .hwd{display:inline-block; margin-left:8px; font-size:14px; font-weight:600; color:var(--ice); white-space:nowrap}
  /* 수업 사진 — 평면. 날짜 덩어리 안 맨 아래에 세 칸씩 */
  .phs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0 14px}
  .phs .p{position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:rgba(130,165,235,.10); cursor:pointer}
  .phs .p img{width:100%; height:100%; object-fit:cover; display:block}
  .phs .p img:not([src]){visibility:hidden}
  .phs .p span{position:absolute; left:0; right:0; bottom:0; padding:3px 7px 4px; font-size:14px; line-height:1.3; color:#fff; background:rgba(5,12,28,.62); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bap{margin-bottom:22px} .bap .nm{font-size:17px; font-weight:600; color:var(--ink); margin-bottom:10px}
  .ba{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .ba .p{position:relative; aspect-ratio:3/4; border-radius:12px; overflow:hidden; background:rgba(130,165,235,.10); cursor:pointer}
  .ba .p img{width:100%; height:100%; object-fit:cover; display:block}
  .ba .p img:not([src]){visibility:hidden}
  .ba .p span{position:absolute; left:0; right:0; bottom:0; padding:5px 9px 6px; font-size:14px; color:#fff; background:rgba(5,12,28,.62)}
  #pv{position:fixed; inset:0; z-index:50; background:rgba(3,8,20,.96)}
  #pv .tr{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  #pv .tr::-webkit-scrollbar{display:none}
  #pv .sl{flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px 14px}
  #pv img{max-width:100%; max-height:78vh; border-radius:10px; object-fit:contain}
  #pv p{margin-top:14px; font-size:15px; color:var(--sub)}
  #pv .x{position:absolute; top:10px; right:10px; width:44px; height:44px; border-radius:50%; border:1px solid rgba(200,220,255,.28); background:rgba(13,26,54,.8); color:#fff; font-size:18px; font-family:inherit; cursor:pointer}
  #pv .ct{position:absolute; left:0; right:0; bottom:18px; text-align:center; font-size:15px; color:var(--sub); font-variant-numeric:tabular-nums; pointer-events:none}
  #sec-gain,#sec-ses{scroll-margin-top:12px}
  .more.sub{border-color:transparent; box-shadow:none; color:var(--sub); font-weight:500; margin-top:8px}
  .more{display:block; width:100%; padding:16px; margin-top:24px; border-radius:14px; border:1px solid rgba(200,220,255,.28); background:none; color:var(--silver); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .more:active{transform:translateY(1px); background:rgba(130,165,235,.08)}
  .empty{text-align:center; color:var(--sub); padding:90px 26px; line-height:1.9}
  .foot{margin:56px 22px 0; padding:24px 0 56px; text-align:center; position:relative}
  .foot:before{content:''; position:absolute; left:20%; right:20%; top:0; height:1px; background:linear-gradient(90deg, rgba(190,212,255,0), rgba(190,212,255,.45), rgba(190,212,255,0))}
  .foot p{font-size:17px; line-height:1.7; color:#C6D3EC}
  .foot .label{display:block; margin-top:16px; color:var(--dim); font-weight:500}

  section,.foot{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .done section,.done .foot{animation:none}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ section,.foot{animation:none} .hero:after{animation:none; display:none} .ring .fgc,.trk .seg{transition:none} }
</style>
<div id="page"><div class="empty">기록을 불러오는 중입니다</div></div>
<script>
const FN='https://kpubgeejyiupdvbbdxwt.supabase.co/functions/v1/mpage';
const DAYS=['일','월','화','수','목','금','토'];
const PARTS=['하체','가슴','등','어깨','팔','코어'];            /* 단련도에 쓰는 부위 — 웜업·유산소·재활·기타는 뺀다 */
const STEPS=[1,3,5,10,15,20,30,40,50,65,80,100,120,150,180,210,240];   /* 이 수업 횟수에 닿을 때마다 한 단계. 그 뒤는 30회마다 */
let D=null, C=null, showS=5, showG=3;
/* 펼친 목록을 다시 접는다 — 접은 뒤 그 묶음의 맨 위로 데려다 준다 */
function fold(k){ if(k==='gain') showG=3; else showS=5; render(); const el=document.getElementById('sec-'+k); if(el) el.scrollIntoView({block:'start'}); }
const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pd(d){ const p=String(d||'').split('-'); return p.length===3? new Date(+p[0],+p[1]-1,+p[2]) : null; }
function dTxt(d){ const x=pd(d); return x? (x.getMonth()+1)+'월 '+x.getDate()+'일 '+DAYS[x.getDay()]+'요일' : String(d||'').replace(/-/g,'.'); }
function dShort(d){ const x=pd(d); if(!x) return ''; return (x.getFullYear()!==new Date().getFullYear()? String(x.getFullYear()).slice(2)+'. ':'')+(x.getMonth()+1)+'. '+x.getDate(); }
function wk(x){ const t=new Date(x.getFullYear(),x.getMonth(),x.getDate()); t.setDate(t.getDate()-((t.getDay()+6)%7)); return t; }   /* 그 주의 월요일 */
function wkKey(x){ const t=wk(x); return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(); }
function r1(v){ return Math.round(v*10)/10; }
function jong(w){ const c=String(w||'').charCodeAt(String(w||'').length-1); return c>=44032&&c<=55203&&(c-44032)%28>0; }   /* 받침이 있나 */
function show(html){ document.getElementById('page').innerHTML=html; }
function stageOf(n){ let lv=0, prev=0, next=STEPS[0]; const T=STEPS.slice(); while(T[T.length-1]<=n+30) T.push(T[T.length-1]+30);
  for(let i=0;i<T.length;i++){ if(n>=T[i]){ lv=i+1; prev=T[i]; next=T[i+1]; } else { next=T[i]; break; } }
  return {lv, prev, next, left:Math.max(0,next-n), p: next>prev? Math.min(1,(n-prev)/(next-prev)) : 0}; }
function titleOf(n){ return n>=200?'운동이 일상':n>=100?'단단해지는 중':n>=50?'꾸준한 사람':n>=30?'자리 잡힘':n>=10?'몸이 익는 중':'첫걸음'; }
function wNum(kg){ return kg>=1000? [r1(kg/1000).toLocaleString(),'톤'] : [Math.round(kg).toLocaleString(),'kg']; }
function weightTxt(kg){ return wNum(kg).join(''); }

/* 올라온 기록에서 화면에 쓸 값을 계산한다 — 전부 실제 기록에서만 */
function calc(d){
  const S=(d.sessions||[]).slice().reverse();                 /* 옛날 → 최근 */
  const total=d.total||S.length, vol=S.reduce((a,s)=>a+(+s.vol||0),0);
  const tops=[]; S.forEach(s=>(s.it||[]).forEach(x=>{ if(x.pr) tops.push({d:s.d, nm:x.nm}); }));
  /* 주별 출석 */
  const byW={}; S.forEach(s=>{ const x=pd(s.d); if(x){ const k=wkKey(x); byW[k]=(byW[k]||0)+1; } });
  const now=wk(new Date()), firstD=S.length&&pd(S[0].d), cells=[];
  const span= firstD? Math.min(16, Math.max(4, Math.round((now-wk(firstD))/6048e5)+1)) : 4;
  for(let i=span-1;i>=0;i--){ const t=new Date(now); t.setDate(t.getDate()-i*7); cells.push(byW[wkKey(t)]||0); }
  let cur=0, best=0, run=0;
  if(firstD){ const t=new Date(wk(firstD)); while(t<=now){ if(byW[wkKey(t)]){ run++; best=Math.max(best,run); } else run=0; t.setDate(t.getDate()+7); }
    const u=new Date(now); if(!byW[wkKey(u)]) u.setDate(u.getDate()-7);        /* 이번 주에 아직 안 왔어도 끊긴 걸로 보지 않는다 */
    while(byW[wkKey(u)]){ cur++; u.setDate(u.getDate()-7); } }
  const ym=(x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))(new Date());
  const month=S.filter(s=>(s.d||'').slice(0,7)===ym).length;
  /* 운동별 처음 → 최고 */
  const ex= d.ex? d.ex.slice() : (d.gains||[]).map(g=>({nm:g.nm, tg:'', u:g.u, f:g.f, b:g.b, n:2}));
  const gains=ex.filter(e=>e.b>e.f).map(e=>({...e, add:r1(e.b-e.f), pct:(e.b-e.f)/e.f})).sort((a,b)=>b.pct-a.pct);
  /* 부위별 단련 — 칸은 그 부위 운동을 한 수업 수(1·5·15·30·60회), 옆 숫자는 그 부위 운동들의 처음 대비 최고 기록 평균 */
  const parts=PARTS.map(t=>{ const n=S.filter(s=>(s.it||[]).some(x=>x.tg===t)).length;
    const g=ex.filter(e=>e.tg===t&&e.n>=2&&e.f>0).map(e=>(e.b-e.f)/e.f*100), avg=g.length? Math.round(g.reduce((a,x)=>a+x,0)/g.length) : 0;
    return {t, n, step:[1,5,15,30,60].filter(v=>n>=v).length, avg}; });
  const hasParts=S.some(s=>(s.it||[]).some(x=>x.tg));
  const kinds=new Set(); S.forEach(s=>(s.it||[]).forEach(x=>kinds.add(x.nm)));
  return {S, total, vol, tops, cells, cur, best, month, gains, parts, hasParts, kinds:kinds.size, st:stageOf(total), last:S[S.length-1]||null};
}
/* 기념 — 받은 것(받은 날짜와 함께)과, 갈래마다 다음 하나 */
function medals(c){
  const out=[], S=c.S;
  const fam=(list, val, unit, when)=>{ let nextShown=false;
    list.forEach(([need,label,face])=>{ if(val>=need) out.push({label, face, on:1, d:when? when(need) : ''});
      else if(!nextShown){ nextShown=true; out.push({label, face, on:0, left:need-val, unit, ratio:val/need}); } }); };
  fam([[1,'첫 수업','첫<small>수업</small>'],[10,'수업 10번','10<small>번</small>'],[30,'수업 30번','30<small>번</small>'],[50,'수업 50번','50<small>번</small>'],[100,'수업 100번','100<small>번</small>'],[200,'수업 200번','200<small>번</small>'],[300,'수업 300번','300<small>번</small>'],[500,'수업 500번','500<small>번</small>']],
      c.total, '번', n=>S[n-1]? S[n-1].d : '');
  if(c.vol>0) fam([[1000,'무게 1톤','1<small>톤</small>'],[10000,'무게 10톤','10<small>톤</small>'],[50000,'무게 50톤','50<small>톤</small>'],[100000,'무게 100톤','100<small>톤</small>'],[300000,'무게 300톤','300<small>톤</small>']],
      c.vol, 'kg', need=>{ let a=0; for(const s of S){ a+=(+s.vol||0); if(a>=need) return s.d; } return ''; });
  if(c.hasParts) fam([[1,'첫 최고 기록','첫<small>기록</small>'],[10,'최고 기록 10번','10<small>기록</small>'],[30,'최고 기록 30번','30<small>기록</small>'],[60,'최고 기록 60번','60<small>기록</small>']],
      c.tops.length, '번', n=>c.tops[n-1]? c.tops[n-1].d : '');
  fam([[4,'4주 연속','4<small>주</small>'],[12,'12주 연속','12<small>주</small>'],[24,'24주 연속','24<small>주</small>']], c.best, '주');
  if(c.hasParts){ const all=c.parts.filter(p=>p.n>0).length; out.push({label:'여섯 부위 모두', face:'6<small>부위</small>', on: all>=PARTS.length?1:0, left:PARTS.length-all, unit:'부위', ratio:all/PARTS.length}); }
  return out;
}

      <span class="label">${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()} 기준</span></footer>`);
  document.title=(d.name||'')+'님의 운동 기록';
  /* 움직임은 셋만 — 단계 고리, 늘어난 선, 무게 숫자(처음 한 번) */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const r=document.getElementById('ringfg'); if(r) r.style.strokeDashoffset=CIRC*(1-st.p);
    document.querySelectorAll('.trk .seg').forEach(b=>{ b.style.transform='scaleX(1)'; }); }));
  const vn=document.getElementById('volnum');
  if(vn&&!still&&!render.done){ const t0=performance.now(), dur=1100; const tick=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); vn.textContent=wNum(c.vol*e)[0]; if(k<1) requestAnimationFrame(tick); else vn.textContent=wv[0]; }; requestAnimationFrame(tick); }
  else if(vn) vn.textContent=wv[0];
  if(!render.done) setTimeout(()=>document.getElementById('page').classList.add('done'), 900);
  render.done=true;
  phFill();
}
/* 숙제 「했어요」(11-13) — 회원이 누르면 선생님 앱의 다음 수업 화면에 보인다. 가장 최근 숙제에만 단추, 지난 숙제는 한 것만 표시.
   안 눌렀다고 따로 표시하지 않는다 */
let HW={}, hwBusy=false;
function hwMark(s, top){
  const at=HW[s.d];
  if(top) return `<button class="hwb${at?' on':''}" onclick="hwTap('${esc(s.d)}')">${at? '✓ 했어요' : '했어요'}</button>`;
  return at? '<span class="hwd">✓ 했어요</span>' : '';
}
async function hwTap(d){
  if(hwBusy) return; hwBusy=true;
  const was=HW[d], on=!was;
  if(on) HW[d]=new Date().toISOString(); else delete HW[d];
  render();
  try{ const t=new URLSearchParams(location.search).get('t')||'';
    const res=await fetch(FN,{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({action:'hw', token:t, d, on})});
    const out=await res.json(); if(!res.ok||!out.ok) throw new Error('서버 '+res.status);
    HW=out.hw||HW;
  }catch(e){ console.error(e); if(was) HW[d]=was; else delete HW[d]; render(); alert('저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'); }
  hwBusy=false;
}
/* 수업 사진 — 기록에는 열쇠만 있다. 화면에 그려진 칸만 사진 서버에 물어 주소를 받아 채운다(주소는 하루 동안 같다) */
const FN_PHOTO='https://kpubgeejyiupdvbbdxwt.supabase.co/functions/v1/photo';
const PHU={}; let phBusy=false;
async function phFill(){
  const blank=()=>[...document.querySelectorAll('img[data-ph]:not([src])')];
  const need=[...new Set(blank().map(e=>e.dataset.ph))].filter(k=>!PHU[k]);
  if(need.length&&!phBusy){ phBusy=true;
    try{ const t=new URLSearchParams(location.search).get('t')||'';
      const res=await fetch(FN_PHOTO,{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({action:'page', t, keys:need.slice(0,300)})});
      if(res.ok) Object.assign(PHU, (await res.json()).urls||{}); }catch(e){ console.error(e); }
    phBusy=false; }
  blank().forEach(e=>{ const u=PHU[e.dataset.ph]; if(u){ e.loading='lazy'; e.src=u; } });
}
/* 크게 보기 — 그날 사진을 옆으로 밀어 넘긴다(11-13 대표님). 폰의 「뒤로」는 크게 보기만 닫는다 */
function phOpen(el){
  const tiles=[...el.parentNode.querySelectorAll('.p')].filter(t=>{ const im=t.querySelector('img'); return im&&im.src; });
  const i0=tiles.indexOf(el); if(i0<0||document.getElementById('pv')) return;
  const o=document.createElement('div'); o.id='pv';
  o.innerHTML=`<div class="tr">${tiles.map(t=>{ const sp=t.querySelector('span'); return `<div class="sl"><img src="${esc(t.querySelector('img').src)}" alt="">${sp? `<p>${esc(sp.textContent)}</p>` : ''}</div>`; }).join('')}</div>
    <button class="x" aria-label="닫기" onclick="phClose()">✕</button>
    ${tiles.length>1? `<div class="ct"><span id="pvn">${i0+1}</span> / ${tiles.length}</div>` : ''}`;
  document.body.appendChild(o); document.body.style.overflow='hidden';
  const tr=o.querySelector('.tr'); tr.scrollLeft=tr.clientWidth*i0;
  tr.addEventListener('scroll', ()=>{ const n=document.getElementById('pvn'); if(n) n.textContent=Math.round(tr.scrollLeft/(tr.clientWidth||1))+1; }, {passive:true});
  tr.addEventListener('click', e=>{ if(e.target.tagName!=='IMG') phClose(); });
  try{ history.pushState({pv:1},''); }catch(e){}
}
function phClose(){ if(document.getElementById('pv')) history.back(); }
window.addEventListener('popstate', ()=>{ const o=document.getElementById('pv'); if(o){ o.remove(); document.body.style.overflow=''; } });
async function boot(){
  const t=new URLSearchParams(location.search).get('t')||'';
  if(!/^[A-Za-z0-9]{20,40}$/.test(t)){ show('<div class="empty">주소가 올바르지 않습니다.<br>선생님께 링크를 다시 받아 주세요.</div>'); return; }
  try{
    const res=await fetch(FN+'?t='+encodeURIComponent(t), {cache:'no-store'});
    if(res.status===404){ show('<div class="empty">이 페이지는 지금 볼 수 없습니다.<br>선생님이 링크를 껐거나 주소가 바뀌었습니다.</div>'); return; }
    const out=await res.json();
    if(!res.ok||!out.data) throw new Error('서버 '+res.status);
    D=out.data; HW=out.hw||{}; render();
  }catch(e){ console.error(e); show('<div class="empty">기록을 불러오지 못했습니다.<br>잠시 뒤 다시 열어 주세요.</div>'); }
}
boot();
</script>
