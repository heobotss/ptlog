  if(r.imps.length){ L.push('🔵 좋아진 것'); r.imps.forEach(x=>L.push(`· ${x.ex} — ${x.iss} (${fmtD(x.date)})`)); }
  if(r.resolved.length){ L.push('🩹 잡은 통증'); r.resolved.forEach(x=>L.push(`· ${x.ex} — ${x.iss}, ${fmtD(x.date)} 이후 재발 없음`)); }

async function shareTextRaw(text){
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError')return; }
  try{ await navigator.clipboard.writeText(text); toast('복사됐습니다 — 카톡에 붙여넣으세요'); }
  catch(e){ showCopy('카톡에 붙여넣을 내용', text); }
}

function createProgram(){
  if(!pdraft.name.trim()){ toast('프로그램 이름을 입력하세요'); return; }
  const pats=pdraft.patterns.filter(p=>p.length);
  if(!pats.length){ toast('운동이 담긴 루틴이 하나는 필요합니다'); return; }
  const days=[]; for(let i=0;i<pdraft.total;i++) days.push({items:[...pats[i%pats.length]]});
  db.programs.push({id:uid(), name:pdraft.name.trim(), goal:pdraft.goal, total:pdraft.total, days, builtin:false});

  save(); go({name:'programs'}); toast('프로그램이 생성됐습니다');

      <div class="muted" style="margin:4px 0 10px">종이 일지를 정리한 가져오기 파일(.json)을 넣으면 회원·운동·수업 기록을 <b>지금 기록에 더합니다</b> — 덮어쓰지 않고, 같은 날짜 기록은 건너뜁니다.</div>
      <input type="file" id="imp-file" accept=".json,application/json" style="display:none" onchange="importFromFile(this)">
      <button class="btn ghost" onclick="document.getElementById('imp-file').click()">📂 가져오기 파일 선택</button>
      <div class="muted" style="margin:10px 0 6px">또는 파일 내용을 붙여넣기</div>
      <textarea id="import-box" placeholder="가져오기 내용 붙여넣기"></textarea>
      <button class="btn subtle" style="margin-top:8px" onclick="importFromBox()">가져오기</button></div>
    <div class="card"><b>특이사항 색 규칙</b>
      <div class="muted" style="margin-top:4px"><span class="iss-bad">빨강 = 부정(통증·자세·약함)</span> ·
      <span class="iss-imp">파랑 = 좋아진 것</span> · <span class="iss-bal">초록 = 좌우 불균형</span></div></div>
    <div class="card"><b>버전</b><div class="muted">수업일지 v2.4 — 📋 오늘 수업 보기 · 기록 평생 무료 · AI 사진 판독 월 10장 무료 · 🖨 8칸 수업지</div></div>
    ${db.members.some(m=>m.demo)?`<button class="btn danger" onclick="clearDemo()">예시 회원(김민수) 삭제</button>`:''}`;
}
async function backup(){
  db.lastBackupCount=db.logs.length; db.lastBackupDate=today(); save();
  const s=JSON.stringify(db);
  try{ await navigator.clipboard.writeText(s); toast('복사됐습니다 — 메모장·카톡 나에게 보내기 등에 붙여넣어 보관하세요'); }
  catch(e){ showCopy('백업 데이터', s); }
}
function restore(){
  let d;
  try{
    const s=document.getElementById('restore-box').value.trim(); if(!s){ toast('붙여넣은 내용이 없습니다'); return; }
    d=JSON.parse(s);
    if(!d.exercises||!d.members) throw 0;
  }catch(e){ toast('복원 실패 — 백업 데이터 형식이 아닙니다'); return; }
  ask('현재 데이터를 백업 내용으로 덮어쓸까요?', '복원', ()=>{
    db=migrate(d); draft=db.draft||null; save(); go({name:'home'}); toast('복원됐습니다'); });
}
/* ── 지난 기록 가져오기 (ptlog-import-v1) ──
   종이 일지를 정리한 꾸러미를 지금 기록에 「더한다」. 덮어쓰지 않는다.
   가져온 수업은 imported 표시 + 프로그램 회차 밖(progId 'import')이라 회차 비교에는 안 끼고,
   운동별 「최근 기록」·검색 타임라인·변화 리포트에는 그대로 쓰인다. */
function importFromFile(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>importText(String(rd.result||''));
  rd.onerror=()=>toast('파일을 읽지 못했습니다');
  rd.readAsText(f,'utf-8');
}
function importFromBox(){ importText((document.getElementById('import-box')||{}).value||''); }
function importText(s){
  let pkg;
  try{ pkg=JSON.parse(s.trim()); }catch(e){ toast('가져오기 실패 — 형식이 맞지 않습니다'); return; }
  if(!pkg||pkg.format!=='ptlog-import-v1'||!pkg.member||!Array.isArray(pkg.logs)){ toast('가져오기 파일이 아닙니다'); return; }
  if(typeof locked==='function' && locked()){ blockEdit(); return; }
  const plan=importPlan(pkg);
  modal(`<b>📥 기록 가져오기</b>
    <div style="font-size:14px; margin:10px 0 14px; line-height:1.9">
      회원 <b>${esc(pkg.member.name)}</b> — ${plan.member?'기존 회원에 더합니다':'<span style="color:var(--blue)">새로 등록합니다</span>'}<br>
      수업 기록 <b class="num">${plan.newLogs}</b>회 (${esc(plan.first)} ~ ${esc(plan.last)})${plan.dup?` · 이미 있는 날짜 <b class="num">${plan.dup}</b>회는 건너뜀`:''}<br>
      새 운동 <b class="num">${plan.newEx.length}</b>개 추가${plan.newEx.length?` <span class="muted" style="font-size:12px">(${esc(plan.newEx.slice(0,6).join(', '))}${plan.newEx.length>6?' 외':''})</span>`:''}</div>
    <div class="grid2"><button class="btn subtle" onclick="closeModal()">취소</button>
      <button class="btn" onclick="closeModal(); applyImport(window.__impPkg)">가져오기</button></div>`);
  window.__impPkg=pkg;
}
function impKey(s){ return String(s||'').trim().toLowerCase(); }
function importPlan(pkg){
  const member=db.members.find(m=>!m.demo && impKey(m.name)===impKey(pkg.member.name));
  const have=new Set(member? db.logs.filter(l=>l.memberId===member.id).map(l=>l.date):[]);
  const dates=pkg.logs.map(l=>l.date).filter(Boolean).sort();
  const newLogs=pkg.logs.filter(l=>l.date && !have.has(l.date)).length;
  const names=new Set(); pkg.logs.forEach(l=>(l.entries||[]).forEach(e=>e.ex&&names.add(String(e.ex).trim())));
  const newEx=[...names].filter(n=>!db.exercises.some(x=>impKey(x.name)===impKey(n)));
  return {member, newLogs, dup:pkg.logs.length-newLogs, newEx, first:dates[0]||'-', last:dates[dates.length-1]||'-'};
}
function applyImport(pkg){
  if(!pkg) return;
  let m=db.members.find(x=>!x.demo && impKey(x.name)===impKey(pkg.member.name));
  if(!m){
    m={id:uid(), name:String(pkg.member.name).trim(), sex:pkg.member.sex||'', note:pkg.member.note||'',
       programId:null, sessionsDone:0, dayAdds:{}, rereg:0};
    db.members.push(m);
  }
  const spec={}; (pkg.exercises||[]).forEach(a=>{ if(Array.isArray(a)) spec[impKey(a[0])]={tag:a[1],mode:a[2]}; });
  const exId=name=>{
    const k=impKey(name); let e=db.exercises.find(x=>impKey(x.name)===k);
    if(!e){ const sp=spec[k]||{};
      e={id:uid(), name:String(name).trim(), tag:TAG_ORDER.includes(sp.tag)?sp.tag:'기타',
         mode:MODES[sp.mode]?sp.mode:'w', custom:true};
      db.exercises.push(e); }
    return e.id;
  };
  const have=new Set(db.logs.filter(l=>l.memberId===m.id).map(l=>l.date));
  let added=0;
  pkg.logs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(L=>{
    if(!L.date || have.has(L.date)) return;
    const entries=(L.entries||[]).map(E=>{
      const id=exId(E.ex);
      const sets=[];
      (E.sets||[]).forEach(s=>{ if(Array.isArray(s)&&num(s[1])>0) sets.push({w:num(s[0]), r:num(s[1])}); });
      (E.sec||[]).forEach(v=>{ if(num(v)>0) sets.push({sec:num(v)}); });
      (E.band||[]).forEach(b=>{ if(Array.isArray(b)&&num(b[1])>0) sets.push({band:BANDS.includes(b[0])?b[0]:BANDS[0], r:num(b[1])}); });
      const o={exId:id, sets, issues:(E.issues||[]).filter(x=>typeof x==='string'), memo:String(E.memo||'').trim()};
      if(E.chk) o.chk=true;
      return o;
    }).filter(e=>e.sets.length||e.chk||e.issues.length||e.memo);
    if(!entries.length) return;
    db.logs.push({id:uid(), memberId:m.id, dayIdx:0, lap:0, date:L.date, cond:String(L.cond||'').trim(),
      progId:'import', imported:true, entries, ...(L.ref?{refDate:L.ref}:{})});
    have.add(L.date); added++;
  });
  /* 기준 수업 날짜를 실제 수업 기록과 잇는다 */
  const byDate={}; db.logs.filter(l=>l.memberId===m.id).forEach(l=>{ byDate[l.date]=l.id; });
  db.logs.filter(l=>l.memberId===m.id && l.refDate && !l.refLogId).forEach(l=>{ if(byDate[l.refDate]) l.refLogId=byDate[l.refDate]; });
  save(); go({name:'logs', id:m.id});
  toast(`가져오기 완료 — 수업 ${added}회를 더했습니다`);
}
function clearDemo(){
  ask('예시 회원과 예시 기록을 삭제할까요?', '삭제', ()=>{
    const ids=db.members.filter(m=>m.demo).map(m=>m.id);
    db.members=db.members.filter(m=>!m.demo);
    db.logs=db.logs.filter(l=>!ids.includes(l.memberId));
    save(); render(); toast('삭제됐습니다'); });
}

/* 다른 기기에서 저장한 내용 반영: 앱으로 돌아올 때 서버 확인, 연결 복구 시 미전송분 전송 */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && user && booted){ sync.dirty? pushNow() : pullNow(); }
});
window.addEventListener('online', ()=>{ if(sync.dirty) pushNow(); });
boot();
</script>
