<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT 수업일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* 앱은 다크 네이비 단일 테마로 고정 — 헬스장 조명에서도 잘 보이는 톤 */
  :root{
    --bg:#0C1424; --card:#131E33; --card2:#182642; --line:#243352;
    --ink:#EAF0FA; --sub:#8FA0BC; --blue:#4D8DFF; --blue-soft:rgba(77,141,255,.14);
    --warn:#FFB454; --warn-soft:rgba(255,180,84,.12); --good:#3DD68C; --good-soft:rgba(61,214,140,.12);
    --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.12); --kakao:#FEE500;
  }
  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{
    color:var(--ink); font-family:'IBM Plex Sans KR',-apple-system,'Malgun Gothic',sans-serif;
    font-size:15px; line-height:1.55;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:16px 14px 92px}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}
  h1{font-size:20px; font-weight:700; letter-spacing:-.01em}
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px}
  .back{color:var(--sub); font-size:14px; background:none; border:none; font-family:inherit; padding:6px 8px 6px 0; cursor:pointer}
  .muted{color:var(--sub); font-size:12.5px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:10px}
  .card.tap{cursor:pointer}
  .card.tap:active{background:var(--card2)}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; background:var(--blue-soft); color:var(--blue); white-space:nowrap}
  .pill.warn{background:var(--warn-soft); color:var(--warn)}
  .pill.good{background:var(--good-soft); color:var(--good)}
  .btn{display:block; width:100%; text-align:center; background:var(--blue); color:#fff; font-weight:700;
    border:none; border-radius:12px; padding:14px; font-size:15px; margin:6px 0; font-family:inherit; cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--blue-soft); color:var(--blue); font-weight:600}
  .btn.subtle{background:var(--card2); color:var(--sub); font-weight:500; font-size:13.5px; padding:11px}
  .btn.kakao{background:var(--kakao); color:#191600}
  .btn.danger{background:none; border:1px solid var(--line); color:var(--bad); font-weight:500; font-size:13px; padding:10px}
  .btn.chkbtn{background:var(--card2); color:var(--sub); border:1px dashed var(--line)}
  .btn.chkbtn.on{background:var(--good-soft); color:var(--good); border:1px solid var(--good)}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],textarea,select{
    width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-family:inherit; font-size:15px; padding:11px 12px; outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--blue)}
  input::placeholder,textarea::placeholder{color:#5B6B88}
  label.fld{display:block; margin-bottom:12px}
  label.fld .muted{display:block; margin-bottom:5px}
  .divider{height:1px; background:var(--line); margin:11px 0}
  .prog{height:6px; border-radius:100px; background:var(--card2); overflow:hidden; margin-top:8px}
  .prog i{display:block; height:100%; background:var(--blue); border-radius:100px}
  .nav{position:fixed; bottom:0; left:0; right:0; background:rgba(12,20,36,.96); border-top:1px solid var(--line); backdrop-filter:blur(8px)}
  .nav .in{max-width:480px; margin:0 auto; display:flex}
  .nav button{flex:1; background:none; border:none; color:var(--sub); font-family:inherit; font-size:11.5px; padding:10px 0 max(12px, env(safe-area-inset-bottom)); cursor:pointer}
  .nav button.on{color:var(--blue); font-weight:600}
  .nav .ico{display:block; font-size:19px; margin-bottom:2px}
  .setrow{display:grid; grid-template-columns:30px 1fr 1fr 34px; gap:7px; align-items:center; margin-bottom:7px}
  .setrow.one{grid-template-columns:30px 1fr 34px}
  .setrow .idx{color:var(--sub); font-size:12px; text-align:center}
  .setrow input,.setrow select{text-align:center; padding:9px 6px; font-size:14.5px}
  .setrow .del{background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer; padding:4px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .pk-row{padding:9px 2px; border-bottom:1px solid var(--line)}
  .pk-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .pk-top .pk-rec{margin-top:0; text-align:right; flex-shrink:0; max-width:48%}
  .pk-row:last-child{border-bottom:none}
  .pk-ex{font-size:18px; font-weight:700; line-height:1.3}
  .pk-rec{font-size:18px; font-weight:700; color:var(--blue); margin-top:2px}
  .pk-rec.none{color:var(--sub); font-weight:500; font-size:15px}
  .pk-best{font-size:14.5px; color:var(--warn); margin-top:3px}
  .pk-warn{font-size:14.5px; color:var(--bad); font-weight:600; margin-top:3px}
  .pk-note{font-size:14px; color:var(--sub); margin-top:2px}
  .ichip{font-size:12px; padding:6px 11px; border-radius:100px; border:1px solid var(--line); color:var(--sub); background:none; font-family:inherit; cursor:pointer}
  .ichip.on-bad{border-color:var(--bad); color:var(--bad); background:var(--bad-soft)}
  .ichip.on-imp{border-color:var(--blue); color:var(--blue); background:var(--blue-soft)}
  .ichip.on-bal{border-color:var(--good); color:var(--good); background:var(--good-soft)}
  .iss-bad{color:var(--bad)} .iss-imp{color:var(--blue)} .iss-bal{color:var(--good)} .iss-etc{color:var(--warn)}
  .prev{background:var(--card2); border-radius:10px; padding:9px 12px; font-size:13px; margin:9px 0}
  .prev b{font-weight:600}
  .exhead{display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:8px}
  .exhead .peek{font-size:12px; color:var(--sub); font-family:'IBM Plex Mono',monospace; white-space:nowrap}
  .exhead .peek.done{color:var(--good); font-family:inherit}
  .tl{border-left:2px solid var(--line); padding-left:12px; margin-top:8px}
  .tl .ev{margin-bottom:9px; font-size:13px}
  .tl .ev .d{font-size:11px; color:var(--sub); font-family:'IBM Plex Mono',monospace}
  .empty{text-align:center; color:var(--sub); padding:38px 16px; font-size:14px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .stat{background:var(--card2); border-radius:10px; padding:10px 12px}
  .stat .v{font-size:17px; font-weight:700}
  .exlist{max-height:300px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; padding:6px; margin:8px 0}
  .exlist .opt{display:flex; justify-content:space-between; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px}
  .exlist .opt:active{background:var(--card2)}
  .exlist .opt .t{color:var(--sub); font-size:11.5px}
  .toast{position:fixed; bottom:78px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line);
    color:var(--ink); font-size:13.5px; padding:10px 18px; border-radius:100px; z-index:99; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:88vw; text-align:center}
  textarea{resize:vertical; min-height:64px}
  .draft{font-size:11px; color:var(--warn)}
  .cond{margin-bottom:12px}
  /* 달력 */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:12px}
  .cal .cwd{text-align:center; font-size:11px; color:var(--sub); padding:2px 0}
  .cal .c{aspect-ratio:0.9; border-radius:9px; background:var(--card); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; cursor:pointer; gap:1px}
  .cal .c .cnt{font-size:9.5px; color:var(--blue); font-weight:600; line-height:1}
  .cal .c.sel{border-color:var(--blue); background:var(--blue-soft)}
  .cal .c.td{box-shadow:inset 0 0 0 1px var(--good)}
  .cal .c.blank{background:none; border:none; cursor:default}
  /* 하단 시트 모달 — 아티팩트 환경이 브라우저 기본 팝업(prompt/confirm)을 차단하므로 자체 구현 */
  .overlay{position:fixed; inset:0; background:rgba(4,8,16,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--card); border:1px solid var(--line); border-radius:18px 18px 0 0; padding:18px 16px max(20px, env(safe-area-inset-bottom));
    width:100%; max-width:480px; max-height:78vh; overflow-y:auto; box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  /* ── 수업지 인쇄 (A4 한 장, 흑백) — 화면에는 안 보이고 인쇄할 때만 나온다 ── */
  #printsheet{display:none}
  @media print{
    body{background:#fff !important; padding:0}
    #app,.nav,.overlay{display:none !important}
    #printsheet{display:block; color:#000; font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif; font-size:12px; line-height:1.45}
    #printsheet .ph{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:4px}
    #printsheet .ph b{font-size:17px}
    #printsheet .ph .r{font-size:12px}
    #printsheet .cline{border-bottom:1px solid #999; padding:5px 0 4px; margin-bottom:6px; font-size:12px}
    #printsheet table{width:100%; border-collapse:collapse}
    #printsheet th{border:1px solid #000; padding:3px 6px; font-size:11px; background:#eee; text-align:left}
    #printsheet td{border:1px solid #000; padding:4px 6px; vertical-align:top}
    #printsheet .exn{font-weight:700; font-size:12.5px; white-space:nowrap}
    #printsheet .prv{font-size:10.5px; color:#333}
    #printsheet .cells{font-size:12px; letter-spacing:.02em}
    #printsheet .cells .bx{display:inline-block; border-bottom:1.5px solid #000; min-width:34px; margin:0 2px}
    #printsheet .foot{margin-top:8px; font-size:10px; color:#555; text-align:center}
    @page{size:A4; margin:7mm}
    #printsheet .s8h{display:flex; flex-wrap:wrap; gap:2px 12px; justify-content:space-between; align-items:baseline; border-bottom:2px solid #000; padding-bottom:3px; margin-bottom:4px; font-size:12px}
    #printsheet .s8h b{font-size:14px}
    #printsheet .s8h span{font-size:10px}
    #printsheet .g8{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(4, 66mm); grid-auto-flow:column; border:1.5px solid #000}
    #printsheet .c8{border:1px solid #000; padding:3px 5px; overflow:hidden; display:flex; flex-direction:column}
    #printsheet .c8 .hd{display:flex; gap:6px; align-items:baseline; border-bottom:1px solid #000; padding-bottom:2px; margin-bottom:2px; font-size:10.5px}
    #printsheet .c8 .hd .rf{margin-left:auto; font-size:10px; font-weight:700}
    #printsheet .c8 .ln{font-size:10.5px; line-height:1.3; padding:1.5px 0; border-bottom:1px dotted #999; white-space:nowrap; overflow:hidden}
    #printsheet .c8 .ln b{font-weight:700}
    #printsheet .c8 .ln sup{font-size:8.5px; color:#333; font-weight:600}
    #printsheet .c8 .nt{font-size:8.5px; line-height:1.25; color:#222; padding:0 0 1.5px 8px; margin-top:-1px; border-bottom:1px dotted #999; white-space:normal; word-break:keep-all}
    #printsheet .c8 .ln:has(+ .nt){border-bottom:none}
    #printsheet .c8.sm .ln{font-size:9.5px; line-height:1.2; padding:1px 0}
    #printsheet .c8.sm .nt{font-size:7.5px}
    #printsheet .c8.xs .ln{font-size:8.5px; line-height:1.12; padding:.5px 0}
    #printsheet .c8.xs .nt{font-size:6.8px; line-height:1.15}
    #printsheet .c8 .ln.blank{color:transparent}
  }
</style>

<div id="app"></div>
<div id="printsheet"></div>
<input type="file" id="ocr-file" accept="image/*" capture="environment" style="display:none">
<input type="file" id="ib-file" accept="image/*" capture="environment" style="display:none">
<div class="nav"><div class="in">
  <button id="nav-home" onclick="go({name:'home'})"><span class="ico">👥</span>회원</button>
  <button id="nav-sch" onclick="go({name:'schedule'})"><span class="ico">🗓</span>시간표</button>
  <button id="nav-prog" onclick="go({name:'programs'})"><span class="ico">📋</span>프로그램</button>
  <button id="nav-lib" onclick="go({name:'library'})"><span class="ico">🏋️</span>운동</button>
  <button id="nav-set" onclick="go({name:'settings'})"><span class="ico">⚙️</span>설정</button>
</div></div>

<script>
/* ───────────────────── 데이터 ───────────────────── */
const LS='ptlog.v1';
/* 기록 방식: w=무게×횟수, t=시간(초), lv=레벨×횟수, band=밴드×횟수, chk=체크만 */
const MODES={w:'무게×횟수', t:'시간(초)', lv:'레벨×횟수', band:'밴드×횟수', chk:'체크만'};
const BANDS=['노랑','빨강','초록','파랑','보라','검정'];
/* 특이사항 3색: 빨강=부정(통증·자세), 파랑=개선, 초록=좌우 불균형 */
const ISSUE_SETS=[
  {cls:'bad', items:['허리 통증','무릎 통증','어깨 통증','자세 무너짐','가동범위 제한','과긴장']},
  {cls:'imp', items:['통증 줄어듦','가동범위 개선','자세 좋아짐']},
  {cls:'bal', items:['왼쪽 약함','오른쪽 약함','좌우 쏠림']},
];
function issueCls(name){
  for(const g of ISSUE_SETS) if(g.items.includes(name)) return g.cls;
  return 'etc';
}
function issueSpan(name){ return `<span class="iss-${issueCls(name)}">${esc(name)}</span>`; }

const BASE_EXERCISES=[
 ['백스쿼트','하체'],['고블릿 스쿼트','하체'],['핵 스쿼트','하체'],['레그 프레스','하체'],['런지','하체'],['스플릿 스쿼트','하체'],
 ['레그 익스텐션','하체'],['레그 컬','하체'],['시티드 레그 컬','하체'],['이너 타이','하체'],['아웃 타이','하체'],
 ['힙 쓰러스트','하체'],['카프 레이즈','하체'],
 ['데드리프트','전신'],['루마니안 데드리프트','하체'],['케틀벨 데드리프트','하체'],['케틀벨 스윙','전신'],
 ['벤치프레스','가슴'],['덤벨 벤치프레스','가슴'],['인클라인 덤벨 프레스','가슴'],['푸시업','가슴'],['체스트 플라이','가슴'],['리버스 펙덱 플라이','가슴'],
 ['숄더 프레스','어깨'],['사이드 레터럴 레이즈','어깨'],['페이스 풀','어깨'],
 ['랫풀다운','등'],['시티드 로우','등'],['하이 로우','등'],['바벨 로우','등'],['덤벨 로우','등'],['풀업','등'],['어시스트 친업','등'],['백 익스텐션','등'],
 ['바벨 컬','팔'],['덤벨 컬','팔'],['트라이셉스 익스텐션','팔'],['케이블 푸시다운','팔'],
 ['크런치','코어'],['레그 레이즈','코어'],['행잉 니업','코어'],['데드버그','코어'],['버드독','코어'],['플랭크 클라이머','코어'],
 ['행잉','코어','t'],['플랭크','코어','t'],['사이드 플랭크','코어','t'],
 ['스텝퍼','유산소','lv'],
 ['밴드 사이드 워크','재활','band'],['밴드 스쿼트','재활','band'],
 ['클램쉘','재활'],['월 슬라이드','재활'],['발목 가동성 드릴','재활'],['힙 힌지 드릴','재활'],
 ['WGS 스트레칭','웜업','chk'],['폼롤러 릴리즈','웜업','chk'],['스미스 랙업','전신'],['클럽벨 캐스트','전신'],
];

function uid(){ return Math.random().toString(36).slice(2,10); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(s){ return s ? s.slice(5).replace('-','/') : ''; }

function seed(){
  const ex = BASE_EXERCISES.map(([name,tag,mode])=>({id:uid(),name,tag,mode:mode||'w',custom:false}));
  const byName=n=>ex.find(e=>e.name===n).id;
  const pA=['WGS 스트레칭','백스쿼트','루마니안 데드리프트','레그 프레스','레그 컬','플랭크'].map(byName);
  const pB=['WGS 스트레칭','벤치프레스','인클라인 덤벨 프레스','숄더 프레스','트라이셉스 익스텐션','크런치'].map(byName);
  const pC=['WGS 스트레칭','랫풀다운','시티드 로우','힙 쓰러스트','덤벨 컬','행잉'].map(byName);
  const days=[]; const pats=[pA,pB,pC];
  for(let i=0;i<30;i++) days.push({items:[...pats[i%3]]});
  const prog={id:uid(), name:'근력 A (기본)', goal:'근력', total:30, days, builtin:true, draft:true};

  const m={id:uid(), name:'김민수 (예시)', note:'32세 · 예시 회원, 삭제해도 됩니다', programId:prog.id, sessionsDone:30, demo:true,
    dayAdds:{}, rereg:1, sex:'남'};
  const logs=[
    {id:uid(), memberId:m.id, dayIdx:1, lap:1, date:'2026-05-14', cond:'컨디션 보통 · 수면 부족',
     entries:[
      {exId:byName('WGS 스트레칭'), sets:[], chk:true, issues:[], memo:''},
      {exId:byName('백스쿼트'), sets:[{w:0,r:20},{w:20,r:12},{w:30,r:8}], issues:['허리 통증'], memo:'마지막 세트 허리 불편감'},
      {exId:byName('루마니안 데드리프트'), sets:[{w:30,r:12},{w:40,r:8}], issues:['왼쪽 약함'], memo:''},
      {exId:byName('레그 프레스'), sets:[{w:80,r:15},{w:110,r:10}], issues:[], memo:''},
      {exId:byName('플랭크'), sets:[{sec:57}], issues:[], memo:''},
     ]},
    {id:uid(), memberId:m.id, dayIdx:2, lap:1, date:'2026-05-17', cond:'',
     entries:[
      {exId:byName('벤치프레스'), sets:[{w:20,r:15},{w:35,r:8}], issues:['통증 줄어듦'], memo:''},
      {exId:byName('숄더 프레스'), sets:[{w:8,r:12},{w:12,r:9}], issues:['가동범위 제한'], memo:'왼쪽 어깨 끝범위 제한'},
     ]},

function migrate(d){

    (d.exercises||[]).forEach(e=>{ if(!e.mode) e.mode=modeByName[e.name]||'w'; });
    const add=[['행잉','코어','t'],['스텝퍼','유산소','lv'],['WGS 스트레칭','웜업','chk'],['폼롤러 릴리즈','웜업','chk'],
      ['밴드 스쿼트','재활','band'],['시티드 레그 컬','하체'],['이너 타이','하체'],['아웃 타이','하체'],['핵 스쿼트','하체'],
      ['하이 로우','등'],['어시스트 친업','등'],['백 익스텐션','등'],['리버스 펙덱 플라이','가슴'],['행잉 니업','코어'],
      ['플랭크 클라이머','코어'],['케틀벨 데드리프트','하체'],['스미스 랙업','전신'],['클럽벨 캐스트','전신']];
    add.forEach(([name,tag,mode])=>{ if(!(d.exercises||[]).some(e=>e.name===name))
      d.exercises.push({id:uid(),name,tag,mode:mode||'w',custom:false}); });
    (d.logs||[]).forEach(l=>{ if(l.cond===undefined) l.cond=''; });
    d.version=2;
  }
  if(d.version<3){
    /* 예시 회원에게 리포트 시연용 기록 1건 추가 */
    const dm=(d.members||[]).find(m=>m.demo);
    if(dm){
      const ex=n=>{ const e=(d.exercises||[]).find(e=>e.name===n); return e?e.id:null; };
      const bs=ex('백스쿼트'), pl=ex('플랭크');
      const already=(d.logs||[]).some(l=>l.memberId===dm.id&&l.dayIdx===4&&l.lap===1);
      if(bs&&pl&&!already) d.logs.push({id:uid(), memberId:dm.id, dayIdx:4, lap:1, date:'2026-05-21', cond:'',
        entries:[{exId:bs, sets:[{w:20,r:12},{w:35,r:8}], issues:['통증 줄어듦'], memo:'허리 통증 없이 수행'},
                 {exId:pl, sets:[{sec:73}], issues:[], memo:''}]});
    }
    d.version=3;
  }
  if(d.version<4){
    /* 회원별 회차 추가 운동 — 수업 중 추가한 운동이 다음 바퀴 같은 회차에도 유지됨 */
    (d.members||[]).forEach(m=>{ if(!m.dayAdds) m.dayAdds={}; });
    d.version=4;
  }
  if(d.version<5){
    (d.members||[]).forEach(m=>{
      if(!m.schedule) m.schedule=[];
      if(m.rereg===undefined){
        const p=(d.programs||[]).find(p=>p.id===m.programId);
        m.rereg = p? Math.floor((m.sessionsDone||0)/p.total) : 0;
      }
    });
    /* 기록에 프로그램 표시 — 프로그램 변경 후 지난 바퀴 비교가 섞이지 않게 */
    (d.logs||[]).forEach(l=>{ if(!l.progId){ const m=(d.members||[]).find(x=>x.id===l.memberId); l.progId=m?m.programId:null; } });
    d.version=5;
  }
  if(d.version<6){
    /* 예약제 달력 — 날짜별 수업 예약 저장소 */
    if(!d.bookings) d.bookings=[];
    if(!d.notify) d.notify={};          /* 날짜별 「스케줄 알림 보냄」 (2026-09-28) */
    d.version=6;
  }
  if(d.version<7){
    (d.members||[]).forEach(m=>{ if(m.sex===undefined) m.sex=''; });
    d.version=7;
  }
  return d;
}

    user=null; db=null; draft=null; pdraft=null; booted=false; isAdmin=false; access=null; lastGood=null;
    sync={dirty:false,timer:null,serverAt:null,offline:false};
    renderLogin(); });
}

/* ── 부팅: 세션 확인 → 서버 데이터 로드 ── */
async function boot(){
  document.getElementById('app').innerHTML='<div class="empty">불러오는 중…</div>';
  if(!sb){ /* 스크립트 로드 실패 — 이 기기 단독 모드로라도 동작 */
    db=loadLegacy(); db=db?migrate(db):seed(); draft=db.draft||null; booted=true; render(); return;
  }
  try{ const {data:{session}}=await sb.auth.getSession(); user=session?session.user:null; }catch(e){ user=null; }
  if(user && recoveryMode){ renderNewPw(); return; } /* 재설정 링크로 온 경우: 홈 대신 새 비밀번호 화면 */
  if(!user){ renderLogin(); return; }
  await bootData();
}
async function bootData(){
  const nav=document.querySelector('.nav'); if(nav) nav.style.display='';
  document.getElementById('app').innerHTML='<div class="empty">기록 불러오는 중…</div>';
  try{
    const {data,error}=await sb.from('trainer_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(error) throw error;
    if(data){ db=migrate(data.data); sync.serverAt=data.updated_at; sync.dirty=false; lastGood=JSON.stringify(db); }
    else{
      await checkAccess(); /* 새 계정: 첫 저장 전에 이용 가능 여부(무료 열람권 자동 적용 포함)부터 */
      /* 계정에 데이터 없음 — 이 기기에 쓰던 기록이 있으면 자동 이관 */
      const legacy=load()||loadLegacy();
      if(legacy && ((legacy.logs||[]).length || (legacy.members||[]).some(m=>!m.demo))){
        db=migrate(legacy); sync.dirty=true; await pushNow();
        toast('이 기기의 기존 기록을 계정으로 올렸습니다');
      } else { db=seed(); sync.dirty=true; await pushNow(); }
    }
  }catch(e){
    const cached=load()||loadLegacy();
    db=cached?migrate(cached):seed(); sync.offline=true;
    toast('서버 연결 실패 — 이 기기 저장으로 동작, 연결되면 자동 전송됩니다');
  }
  draft=db.draft||null; pdraft=null; booted=true;
  try{ localStorage.setItem(lsKey(), JSON.stringify(db)); }catch(e){}
  view={name:'home'}; render();
  checkAccess(); loadOcrQuota();
  /* 관리자 여부 확인 (백그라운드) */
  isAdmin=false;
  loadScorecard();
  sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle()
    .then(r=>{ if(r&&r.data){ isAdmin=true; if(view.name==='home'||view.name==='settings') render(); } });
}

/* ───────────────────── 계산 ───────────────────── */
function exOf(id){ return db.exercises.find(e=>e.id===id); }
function exName(id){ const e=exOf(id); return e?e.name:'(삭제된 운동)'; }
function exMode(id){ const e=exOf(id); return e?(e.mode||'w'):'w'; }

function validSets(sets, mode){
  const a=(sets||[]).filter(Boolean);
  if(mode==='t') return a.filter(s=>(parseFloat(s.sec)||0)>0);
  if(mode==='lv') return a.filter(s=>(parseFloat(s.n)||0)>0);
  if(mode==='band') return a.filter(s=>(parseFloat(s.r)||0)>0);
  return a.filter(s=>(parseFloat(s.r)||0)>0);
}
function num(v){ return parseFloat(v)||0; }
function entryHasRecord(en, mode){ return mode==='chk' ? !!en.chk : validSets(en.sets, mode).length>0; }

function bestW(sets){ const v=validSets(sets,'w').filter(s=>num(s.w)>0); if(!v.length)return null;
  return v.slice().sort((a,b)=> num(b.w)-num(a.w) || num(b.r)-num(a.r))[0]; }
function bestR(sets){ const v=validSets(sets,'w'); if(!v.length)return null;
  return v.slice().sort((a,b)=> num(b.r)-num(a.r) || num(b.w)-num(a.w))[0]; }
function e1rm(sets){ const v=validSets(sets,'w').filter(s=>num(s.w)>0); if(!v.length)return null;
  const low=v.filter(s=>num(s.r)<=10); const pool=low.length?low:v;
  const val=Math.max(...pool.map(s=>num(s.w)*(1+num(s.r)/30)));
  return {v:Math.round(val*10)/10, ref:!low.length}; }
function bestT(sets){ const v=validSets(sets,'t'); if(!v.length)return null; return Math.max(...v.map(s=>num(s.sec))); }
function bestLv(sets){ const v=validSets(sets,'lv'); if(!v.length)return null;
  return v.slice().sort((a,b)=> num(b.lv)-num(a.lv) || num(b.n)-num(a.n))[0]; }
function lastBand(sets){ const v=validSets(sets,'band'); return v.length? v[v.length-1] : null; }
function volume(sets){ return validSets(sets,'w').reduce((a,s)=>a+(num(s.w)>0?num(s.w)*num(s.r):0),0); }
function setStr(s){ return (num(s.w)>0? num(s.w)+'kg':'맨몸')+'×'+num(s.r); }

/* 접힌 목록용 한 줄 요약 — 종이 일지의 위첨자 역할 */
function compactStr(en, mode){
  if(mode==='chk') return en.chk!==undefined? '체크 항목':'';
  const sets=en.sets;
  if(mode==='t'){ const t=bestT(sets); return t? t+'초':''; }
  if(mode==='lv'){ const b=bestLv(sets); return b? 'Lv'+num(b.lv)+'×'+num(b.n):''; }
  if(mode==='band'){ const b=lastBand(sets); return b? b.band+'×'+num(b.r):''; }
  const bw=bestW(sets)||bestR(sets); return bw? setStr(bw):'';
}
/* 상세 블록용 문자열 */
function detailStr(en, mode){
  if(mode==='chk') return en.chk? '✓ 완료':'';
  const sets=en.sets;
  if(mode==='t'){ const t=bestT(sets); return t? `최고 <b class="num">${t}초</b>`:''; }
  if(mode==='lv'){ const b=bestLv(sets); return b? `<b class="num">Lv${num(b.lv)} × ${num(b.n)}</b>`:''; }
  if(mode==='band'){ const b=lastBand(sets); return b? `<b class="num">${b.band} 밴드 × ${num(b.r)}</b>`:''; }
  const bw=bestW(sets), br=bestR(sets), rm=e1rm(sets);
  let out=[];
  if(bw) out.push(`최대 중량 <b class="num">${setStr(bw)}</b>`);
  if(br&&(!bw||br!==bw)) out.push(`최다 반복 <b class="num">${setStr(br)}</b>`);
  if(rm) out.push(`e1RM <b class="num">${rm.v}kg</b>${rm.ref?'<span class="muted">(참고치)</span>':''}`);
  return out.join(' · ');
}

function memberProgress(m){
  const p=db.programs.find(p=>p.id===m.programId);
  if(!p) return null;
  const total=p.total, done=m.sessionsDone||0;
  const nextDay=done%total+1, lap=Math.floor(done/total)+1;
  return {p, total, done, nextDay, lap, remaining: total-(done%total), rebadge: (done%total)>=total-3};
}
function prevRecord(memberId, exId, dayIdx, lap, progId){
  const mode=exMode(exId);
  const has=e=> e.exId===exId && (mode==='chk'? e.chk : validSets(e.sets,mode).length);
  const logs=db.logs.filter(l=>l.memberId===memberId);
  /* 같은 회차 비교는 같은 프로그램 안에서만 — 프로그램을 바꾸면 회차 의미가 달라지므로 */
  const same=logs.filter(l=>l.dayIdx===dayIdx && l.lap<lap && (!progId||!l.progId||l.progId===progId)).sort((a,b)=>b.lap-a.lap);
  for(const l of same){ const e=(l.entries||[]).find(has); if(e) return {e, label:l.lap+'바퀴 · '+fmtD(l.date), samePos:true}; }
  const all=logs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  for(const l of all){ const e=(l.entries||[]).find(has); if(e) return {e, label:'최근 기록 · '+fmtD(l.date), samePos:false}; }
  return null;
}

/* ── 부위별 정렬: 새 운동은 같은 부위 그룹의 맨 뒤에 붙는다 ── */
const TAG_ORDER=['웜업','하체','가슴','등','어깨','팔','코어','전신','유산소','재활','기타'];
function sortedEx(list){
  const ord=t=>{ const i=TAG_ORDER.indexOf(t); return i<0?99:i; };

}

/* ── 주간 브리핑 — 매주 월요일부터, 닫을 때까지 홈에 뜬다 ── */
function dfmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekKey(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return dfmt(d); }
function briefData(){
  const tm=weekKey();
  const mon=new Date(tm); const lastMon=new Date(mon); lastMon.setDate(mon.getDate()-7);
  const prevMon=new Date(mon); prevMon.setDate(mon.getDate()-14);
  const lm=dfmt(lastMon), pm=dfmt(prevMon);
  const inR=(s,a,b)=> s>=a && s<b;
  const lastCnt=db.logs.filter(l=>inR(l.date||'',lm,tm)).length;
  const prevCnt=db.logs.filter(l=>inR(l.date||'',pm,lm)).length;
  const noshows=db.bookings.filter(b=>inR(b.date||'',lm,tm)&&b.status==='noshow');
  const nsNames=[...new Set(noshows.map(b=>{ const m=db.members.find(x=>x.id===b.memberId); return m?m.name:null; }).filter(Boolean))];
  const rebadge=db.members.filter(m=>!m.demo).filter(m=>{ const p=memberProgress(m); return p&&p.rebadge; }).map(m=>m.name);
  const cut=new Date(); cut.setDate(cut.getDate()-14); const cutoff=dfmt(cut);
  const idle=db.members.filter(m=>!m.demo).map(m=>{
    const ds=db.logs.filter(l=>l.memberId===m.id && !l.imported).map(l=>l.date||'').sort();
    return {name:m.name, last:ds[ds.length-1]};
  }).filter(x=>x.last && x.last<cutoff);
  return {lastCnt, diff:lastCnt-prevCnt, noshowCnt:noshows.length, nsNames, rebadge, idle};
}
function briefHtml(){
  if(!db || !db.logs.length) return '';
  if(db.lastBriefWeek===weekKey()) return '';
  const b=briefData();
  const rows=[];
  rows.push(`· 지난주 수업 <b class="num">${b.lastCnt}</b>회 <span class="muted num">(전주 ${b.diff>=0?'+':''}${b.diff})</span>`);
  if(b.noshowCnt) rows.push(`· 지난주 노쇼 <b class="num" style="color:var(--bad)">${b.noshowCnt}</b>회 — ${b.nsNames.map(esc).join(', ')}`);
  if(b.rebadge.length) rows.push(`· <span style="color:var(--warn)">재등록 타이밍</span>: ${b.rebadge.map(esc).join(', ')}`);
  if(b.idle.length) rows.push(`· <span style="color:var(--bad)">2주 넘게 안 온 회원</span>: ${b.idle.map(x=>esc(x.name)+' <span class="muted num">('+fmtD(x.last)+'~)</span>').join(', ')} — 연락해 보세요`);
  return `<div class="card" style="border-color:var(--blue)">
    <div class="row"><b>📋 이번 주 브리핑</b>
      <button class="ichip" onclick="db.lastBriefWeek=weekKey(); save(); render()">닫기</button></div>
    <div style="font-size:13.5px; margin-top:6px; line-height:1.9">${rows.join('<br>')}</div></div>`;
}

      <button class="ichip" onclick="go({name:'peek', id:'${r.m.id}', k:0})">📋 오늘 수업 보기</button></div>`; }).join('')}</div>`:'';

/* ── 이달의 성적표 (2026-10-01)
   매월 1일 PC 생성기가 지난달 숫자(회원 기록 경신·통증 잡은 회원·수업 횟수·블로그 순위)로 스토리 카드 두 장을 굽는다.
   여기서는 보여 주고 「스토리에 올리기」만 한다. 센터 이름은 본인이 켜고 끈다(둘 다 이미 구워져 있다). ── */
async function loadScorecard(){
  scorecard=null;
  if(!user) return;
  try{
    const r=await fetch(`${SB_URL}/storage/v1/object/public/scorecards/${user.id}/latest.json?t=${Date.now()}`, {cache:'no-store'});
    if(!r.ok) return;
    const j=await r.json();
    if(j && j['카드']){ scorecard=j; if(view.name==='home') render(); }
  }catch(e){ /* 아직 성적표가 없으면 조용히 */ }
}
function scorecardCenterOn(){
  if(db && typeof db.scorecardCenter==='boolean') return db.scorecardCenter;
  return scorecard ? scorecard['센터이름기본표시']!==false : true;
}
function scorecardUrl(){ return scorecardCenterOn() ? (scorecard['카드_센터']||scorecard['카드']) : scorecard['카드']; }
function scorecardHtml(){
  if(!scorecard) return '';
  const ym=scorecard['달']||'', [y,m]=ym.split('-');
  if(db && db.scorecardHide===ym) return `<div class="card tap" onclick="db.scorecardHide=null; save(); render()">
    <div class="row"><span class="muted">🏅 이달의 성적표 (${+m}월) — 다시 보기</span><span class="muted">›</span></div></div>`;
  const 줄=scorecard['줄']||[];
  const line=x=>`${esc(x[0])} <b class="num">${esc(String(x[1]))}${esc(x[2]||'')}</b>${x[3]?` <span style="color:${String(x[3]).startsWith('▲')?'var(--blue)':'var(--muted)'}">${esc(x[3])}</span>`:''}`;
  const sum=줄.map(line).join(' · ');
  /* 나만 보는 숫자 — 0 도 ▼ 도 전부. 카드에는 0 과 ▼ 가 실리지 않는다(공개 카드 규칙) */
  const priv=scorecard['비공개줄']||[];
  const privOpen=!!(db&&db.scorecardPrivOpen);
  const privHtml= priv.length? `<div class="card tap" style="margin:10px 0 0; padding:10px 12px" onclick="db.scorecardPrivOpen=!db.scorecardPrivOpen; save(); render()">
      <div class="row"><span class="muted">🔒 나만 보는 숫자 (0·▼ 포함)</span><span class="muted">${privOpen?'접기':'펼치기'}</span></div>

    </div>`:'';

      <input type="checkbox" ${scorecardCenterOn()?'checked':''} onchange="db.scorecardCenter=this.checked; db.scorecardPrefs=Object.assign({hide:[]},db.scorecardPrefs||{},{center:this.checked}); save(); render()"></label>

    <div class="row">
      <button class="btn ghost" style="flex:1" onclick="copyReferral()">🔗 추천 링크 복사</button>

}
function toggleScorecardLine(label, on){
  const p=Object.assign({hide:[]}, db.scorecardPrefs||{});
  const hide=new Set(p.hide||[]);
  if(on) hide.delete(label); else hide.add(label);
  const cands=scorecard?(scorecard['줄후보']||[]):[];
  if(cands.length && cands.filter(l=>!hide.has(l)).length<2){ toast('두 줄은 남겨야 합니다'); render(); return; }
  p.hide=[...hide]; db.scorecardPrefs=p; save(); render();
}
async function shareScorecard(){
  if(!scorecard) return;
  const url=scorecardUrl();
  try{
    const b=await (await fetch(url,{cache:'no-store'})).blob();
    const file=new File([b], `scorecard-${scorecard['달']}.jpg`, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'이달의 성적표'});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  window.open(url,'_blank');
  toast('이미지를 길게 눌러 저장한 뒤 인스타 스토리에 올리세요');
}
async function copyReferral(){
  const link=scorecard && scorecard['추천링크'];
  if(!link){ toast('추천 링크가 아직 없습니다'); return; }
  try{ await navigator.clipboard.writeText(link); toast('복사됐습니다 — 인스타 프로필·DM에 붙이세요'); }
  catch(e){ prompt('추천 링크', link); }
}

/* ── 센터 대시보드 (관리자 전용) ── */
function calcTrainer(row){
  const d=row.data||{};
  const demoIds=(d.members||[]).filter(m=>m.demo).map(m=>m.id);
  const members=(d.members||[]).filter(m=>!m.demo);
  const logs=(d.logs||[]).filter(l=>!demoIds.includes(l.memberId));
  const ym=today().slice(0,7);
  const monthCnt=logs.filter(l=>(l.date||'').slice(0,7)===ym).length;
  const rebadge=[];
  members.forEach(m=>{
    const p=(d.programs||[]).find(p=>p.id===m.programId); if(!p) return;
    const done=(m.sessionsDone||0)%p.total;
    if(done>=p.total-3) rebadge.push(`${m.name} (${done}/${p.total})`);
  });
  const byMonth={};
  logs.forEach(l=>{ const k=(l.date||'').slice(0,7); if(k) byMonth[k]=(byMonth[k]||0)+1; });
  const rereg=members.reduce((a,m)=>a+(m.rereg||0),0);
  const noshow=(d.bookings||[]).filter(b=>(b.date||'').slice(0,7)===ym && b.status==='noshow').length;
  return {uid:row.user_id, noshow, name:(d.trainerName||'').trim(), email:row.email||'(이메일 미기록)',
    updated:(row.updated_at||'').slice(0,10).replace(/-/g,'.'),
    members:members.length, monthCnt, total:logs.length, rereg, rebadge, byMonth};
}

/* ── 달력 시간표 (예약제) + 월별 수업 통계 ── */
function vSchedule(){
  const ym = view.ym || today().slice(0,7);
  const [y,mo]=ym.split('-').map(Number);
  if(!view.day && today().slice(0,7)===ym) view.day=today();
  const selDay = (view.day&&view.day.slice(0,7)===ym)? view.day : null;
  const firstDow=new Date(y,mo-1,1).getDay();
  const dim=new Date(y,mo,0).getDate();
  /* 날짜별 예약 수 */
  const cntByDate={};
  db.bookings.forEach(b=>{ if((b.date||'').slice(0,7)===ym) cntByDate[b.date]=(cntByDate[b.date]||0)+1; });
  let cells=DAYS.map(d=>`<div class="cwd">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) cells+='<div class="c blank"></div>';
  for(let d=1;d<=dim;d++){
    const ds=ym+'-'+String(d).padStart(2,'0');
    const cnt=cntByDate[ds]||0;
    cells+=`<div class="c ${ds===selDay?'sel':''} ${ds===today()?'td':''}" onclick="view.day='${ds}'; render()">
      <span class="num">${d}</span>${cnt?`<span class="cnt num">${cnt}</span>`:'<span class="cnt">&nbsp;</span>'}</div>`;
  }
  /* 선택한 날의 시간대 (06~23시) */
  let dayHtml='';
  if(selDay){
    const dayB=db.bookings.filter(b=>b.date===selDay).sort((a,b)=>a.t.localeCompare(b.t));
    const rows=[];
    for(let h=6;h<=23;h++){
      const hh=String(h).padStart(2,'0');
      const slot=dayB.filter(b=>b.t.slice(0,2)===hh);
      rows.push(`<div class="row" style="padding:4px 0; border-bottom:1px solid var(--line)">
        <span class="muted num" style="width:44px">${hh}:00</span>
        <span style="flex:1; display:flex; flex-wrap:wrap; gap:5px">${slot.map(b=>{
          const bm=db.members.find(x=>x.id===b.memberId);
          const st=BK_STATUS[b.status];
          return `<span class="ichip" onclick="openBookingModal('${b.id}')"
            style="color:${b.status==='cancel'?'var(--sub)':'var(--ink)'}; ${st?`border-color:${st[1]};`:''} ${b.status==='cancel'?'text-decoration:line-through;':''}">
            ${st?`<span style="color:${st[1]}">${st[0]}</span> `:''}${b.t.slice(3)==='30'?'<span class=num>'+b.t+'</span> ':''}${esc(bm?bm.name:'?')}</span>`; }).join('')}</span>
        <button class="ichip" onclick="openBookModal('${selDay}','${hh}')">＋</button></div>`);
    }
    const wd2=new Date(y,mo-1,parseInt(selDay.slice(8))).getDay();
    dayHtml=`<div class="card"><div class="row"><b>${fmtD(selDay)} (${DAYS[wd2]})</b>
      <span class="muted num">${dayB.length}건</span></div>
      <div style="margin-top:8px">${rows.join('')}</div></div>`;
  }
  /* 월별 통계: 예약 + 완료 수업 + 노쇼 */
  const bkCnt=Object.values(cntByDate).reduce((a,b)=>a+b,0);
  const logCnt=db.logs.filter(l=>(l.date||'').slice(0,7)===ym).length;
  const nsCnt=db.bookings.filter(b=>(b.date||'').slice(0,7)===ym && b.status==='noshow').length;
  const byMonth={};
  db.logs.forEach(l=>{ const k=(l.date||'').slice(0,7); if(k) byMonth[k]=(byMonth[k]||0)+1; });
  const months=Object.keys(byMonth).sort().reverse().slice(0,6);
  const statHtml=months.map(k=>`<div class="row" style="padding:3px 0"><span class="muted num">${k.replace('-','.')}</span><b class="num">${byMonth[k]}회</b></div>`).join('');
  return `<div class="top">
    <button class="back num" onclick="calShift(-1)">◀</button>
    <h1 class="num">${y}년 ${mo}월</h1>
    <button class="back num" style="padding:6px 0 6px 8px" onclick="calShift(1)">▶</button></div>
    <div class="row" style="margin:-10px 0 10px"><span class="muted">이 달 예약 <b class="num">${bkCnt}</b>건 · 완료 <b class="num">${logCnt}</b>회${nsCnt?` · <span style="color:var(--bad)">노쇼 <b class="num">${nsCnt}</b>회</span>`:''}</span>
      <span class="muted" style="cursor:pointer" onclick="view.ym=null; view.day=null; render()">오늘로</span></div>
    <div class="cal">${cells}</div>
    ${dayHtml||'<div class="empty">날짜를 누르면 그날 시간표가 열립니다</div>'}
    <div class="card"><b>월별 완료 수업</b>
      <div class="muted" style="margin-bottom:6px">「수업 완료」 저장 기준</div>
      ${statHtml||'<div class="muted">아직 기록 없음</div>'}</div>`;
}

      if(iss||e.memo) notes.push(`${fmtD(l.date)} ${esc(exName(e.exId))} — ${[iss, esc(e.memo)].filter(Boolean).join(', ')}`); });

  return `<div class="top"><button class="back" onclick="go({name:'home'})">←</button>
    <h1>${esc(m.name)}<span class="muted" style="font-size:14px; cursor:pointer" onclick="openSexModal('${m.id}')"> ${m.sex?`(${m.sex})`:'(성별 입력)'}</span></h1>
    <span>${m.rereg?`<span class="pill good">재등록 ${m.rereg}회</span>`:''}</span></div>
    ${m.note?`<div class="muted" style="margin:-8px 0 12px">${esc(m.note)}</div>`:''}
    ${pr?`<div class="card">
      <div class="row"><b>${esc(pr.p.name)}</b>${pr.lap>1?`<span class="pill good">${pr.lap}바퀴째</span>`:''}</div>
      <div class="muted">진행 <span class="num">${pr.done%pr.total}/${pr.total}</span>회 · 잔여 <span class="num">${pr.remaining}</span>회
        ${pr.rebadge?' · <span style="color:var(--warn)">재등록 타이밍</span>':''}</div>
      <div class="prog"><i style="width:${(pr.done%pr.total)/pr.total*100}%"></i></div>
    </div>
    ${draft&&draft.memberId===m.id
      ?`<button class="btn" onclick="go({name:'session'})">▶ A-${draft.dayIdx} 수업 이어하기 (자동 저장됨)</button>
        <button class="btn subtle" onclick="discardDraft()">진행 중 입력 버리기</button>`
      :`<button class="btn" onclick="startSession('${m.id}')">A-${pr.nextDay} 수업 시작</button>`}
    <button class="btn ghost" onclick="go({name:'peek', id:'${m.id}', k:0})">📋 오늘 수업 보기 — 종이에 옮겨 적기용</button>
    <button class="btn ghost" onclick="printSheet8('${m.id}')">🖨 다음 8회 수업지 인쇄 — 종이로 수업하기</button>`
    :cycleCard(m)}
    ${db.logs.some(l=>l.memberId===m.id)&&!(draft&&draft.memberId===m.id)?`<button class="btn ghost" style="border:1px solid var(--warn); color:var(--warn); background:var(--warn-soft)" onclick="openRefPicker('${m.id}')">📌 기준 수업 불러오기 — 지난 수업과 비교하며 수업</button>`:''}
    <button class="btn ghost" onclick="go({name:'search', id:'${m.id}'})">🔍 운동으로 기록 찾기</button>
    <button class="btn ghost" onclick="go({name:'report', id:'${m.id}'})">📈 변화 리포트${pr&&pr.rebadge?' — 재등록 상담에 쓰세요':''}</button>
    <button class="btn ghost" onclick="go({name:'inbody', id:'${m.id}'})">⚖️ 인바디${(m.inbody||[]).length?` · ${m.inbody.length}회 측정 (최근 ${fullD(ibSorted(m).slice(-1)[0].date)})`:' — 측정 기록 넣기'}</button>
    <button class="btn ghost" onclick="go({name:'logs', id:'${m.id}'})">🗂 지난 수업 기록 · 수정</button>
    <div class="grid2">
      <button class="btn subtle" onclick="openProgChange('${m.id}')">${pr?'프로그램 변경':'프로그램 배정'}</button>
      <button class="btn subtle" onclick="openRereg('${m.id}')">🔁 재등록 처리</button></div>
    ${notes.length?`<div class="card"><div class="muted" style="margin-bottom:6px">최근 컨디션·특이사항</div>
      <div style="font-size:13px">${notes.slice(0,6).join('<br>')}</div></div>`:''}
    <button class="btn danger" onclick="delMember('${m.id}')">회원 삭제</button>`;
}
function delMember(id){
  const m=db.members.find(x=>x.id===id);
  ask(`${m.name} 회원과 모든 기록을 삭제할까요?`, '삭제', ()=>{
    db.members=db.members.filter(x=>x.id!==id);
    db.logs=db.logs.filter(l=>l.memberId!==id);
    save(); go({name:'home'}); });
}

/* ───────────────────── 화면: 수업 ───────────────────── */
function newSet(mode, prevSet){
  if(mode==='t') return {sec:''};
  if(mode==='lv') return {lv:prevSet?prevSet.lv:'', n:''};
  if(mode==='band') return {band:prevSet?prevSet.band:BANDS[0], r:''};
  return {w:prevSet?prevSet.w:'', r:''};
}
function startSession(memberId){
  const m=db.members.find(x=>x.id===memberId); const pr=memberProgress(m);
  /* 임시 저장된 수업이 있으면 이어가기 */
  if(draft && draft.memberId===memberId){ go({name:'session'}); toast('임시 저장된 수업을 이어갑니다'); return; }
  if(draft){
    const dm=db.members.find(x=>x.id===draft.memberId);
    ask(`${dm?dm.name:'다른 회원'}의 A-${draft.dayIdx} 수업이 진행 중입니다.\n버리고 새 수업을 시작할까요?`, '버리고 시작',
      ()=>{ draft=null; dsave(); startSession(memberId); });
    return;
  }
  const day=pr.p.days[pr.nextDay-1]||{items:[]};
  const adds=((m.dayAdds||{})[pr.nextDay]||[]).filter(id=>!day.items.includes(id)&&exOf(id));
  draft={memberId, dayIdx:pr.nextDay, lap:pr.lap, cond:'', progId:m.programId,
    entries: [...day.items, ...adds].map(exId=>{
      const mode=exMode(exId);
      return {exId, mode, sets: mode==='chk'? []:[newSet(mode)], chk:false, issues:[], memo:'', open:false};
    })};
  dsave();
  go({name:'session'});
}
function discardDraft(){
  ask('진행 중이던 수업 입력을 버릴까요?', '버리기', ()=>{ draft=null; dsave(); render(); toast('버렸습니다'); });
}
function setInputRow(en,i,s,si){
  const mode=en.mode;
  if(mode==='t') return `<div class="setrow one"><span class="idx num">${si+1}</span>
    <input type="number" inputmode="numeric" placeholder="초" value="${s.sec}" onchange="draft.entries[${i}].sets[${si}].sec=this.value; dsave()">
    <button class="del" onclick="delSet(${i},${si})">✕</button></div>`;
  if(mode==='lv') return `<div class="setrow"><span class="idx num">${si+1}</span>
    <input type="number" inputmode="numeric" placeholder="레벨" value="${s.lv}" onchange="draft.entries[${i}].sets[${si}].lv=this.value; dsave()">
    <input type="number" inputmode="numeric" placeholder="횟수/스텝" value="${s.n}" onchange="draft.entries[${i}].sets[${si}].n=this.value; dsave()">
    <button class="del" onclick="delSet(${i},${si})">✕</button></div>`;
  if(mode==='band') return `<div class="setrow"><span class="idx num">${si+1}</span>
    <select onchange="draft.entries[${i}].sets[${si}].band=this.value; dsave()">${BANDS.map(b=>`<option ${b===s.band?'selected':''}>${b}</option>`).join('')}</select>
    <input type="number" inputmode="numeric" placeholder="횟수" value="${s.r}" onchange="draft.entries[${i}].sets[${si}].r=this.value; dsave()">
    <button class="del" onclick="delSet(${i},${si})">✕</button></div>`;
  return `<div class="setrow"><span class="idx num">${si+1}</span>
    <input type="number" inputmode="decimal" placeholder="kg · 맨몸=0" value="${s.w}" onchange="draft.entries[${i}].sets[${si}].w=this.value; dsave()">
    <input type="number" inputmode="numeric" placeholder="횟수" value="${s.r}" onchange="draft.entries[${i}].sets[${si}].r=this.value; dsave()">
    <button class="del" onclick="delSet(${i},${si})">✕</button></div>`;
}
function vSession(){
  if(!draft) return vHome();
  const m=db.members.find(x=>x.id===draft.memberId);
  const doneCnt=draft.entries.filter(en=>entryHasRecord(en,en.mode)).length;
  const cards=draft.entries.map((en,i)=>{
    const mode=en.mode;
    const prev=cmpPrev(draft, en.exId);
    const done=entryHasRecord(en,mode);
    /* 접힌 상태 오른쪽: 종이 일지의 위첨자처럼 지난 최고 기록을 작게 */
    const best=bestTxt(draft.memberId, en.exId);
    const bestPeek= best && best.kind!=='last' && !(prev && prev.e===best.e)? ` · 🏆${best.rec}` : '';
    const peek = done? `<span class="peek done">✓ 기록됨</span>`
      : prev? `<span class="peek">${prev.isRef?'📌':'지난'} ${mode==='chk'?'✓ '+(prev.label.split(' · ')[1]||prev.label) : compactStr(prev.e,mode)}${bestPeek}</span>`
      : best&&best.kind!=='last'? `<span class="peek">🏆${best.rec}</span>` : `<span class="peek">첫 기록</span>`;
    let body='';
    if(en.open){
      let prevHtml='';
      if(prev){
        const iss=(prev.e.issues||[]).map(issueSpan).join(', ');
        const memoTxt=prev.e.memo?esc(prev.e.memo):'';
        prevHtml=`<div class="prev"><span class="muted">${prev.isRef?'📌 기준 수업':prev.samePos?'지난 바퀴 같은 회차':'참고'} · ${prev.label}</span><br>
          ${mode==='chk'? '✓ 완료': detailStr(prev.e,mode)}
          ${iss||memoTxt?`<br>⚠ ${[iss,memoTxt].filter(Boolean).join(', ')}`:''}
          ${best?`<br><span style="color:var(--warn)">${best.kind==='last'?`🕘 마지막으로 한 날 · ${fullD(best.date)}`:`🏆 전체 ${bestWord(best)} <b class="num">${esc(best.rec)}</b> · ${fullD(best.date)}${prev.e===best.e?' (이 날)':''}`}</span>`:''}</div>`;
      } else prevHtml= best&&best.kind!=='last'? `<div class="prev"><span style="color:var(--warn)">🏆 전체 ${bestWord(best)} <b class="num">${esc(best.rec)}</b> · ${fullD(best.date)}</span></div>`
        : `<div class="prev muted">이전 기록 없음 — 오늘이 기준점이 됩니다</div>`;
      const chips=ISSUE_SETS.map(g=>g.items.map(p=>
        `<button class="ichip ${en.issues.includes(p)?'on-'+g.cls:''}" onclick="togIssue(${i},'${p}')">${p}</button>`).join('')).join('');
      const inputArea = mode==='chk'
        ? `<button class="btn chkbtn ${en.chk?'on':''}" onclick="draft.entries[${i}].chk=!draft.entries[${i}].chk; dsave(); render()">${en.chk?'✓ 완료':'완료 체크'}</button>`
        : `<div class="muted" style="margin-bottom:6px">오늘 기록 <span style="opacity:.7">(${MODES[mode]})</span></div>
           ${en.sets.map((s,si)=>setInputRow(en,i,s,si)).join('')}
           <div class="grid2">
             <button class="btn subtle" onclick="loadPrev(${i})">↺ 지난 기록 불러오기</button>
             <button class="btn subtle" onclick="addSet(${i})">＋ 세트 추가</button></div>`;
      const isAdd=((m.dayAdds||{})[draft.dayIdx]||[]).includes(en.exId);
      body=`${prevHtml}${inputArea}
        <div class="chips">${chips}</div>
        <input type="text" style="margin-top:9px" placeholder="특이사항 메모 (선택)" value="${esc(en.memo)}" onchange="draft.entries[${i}].memo=this.value; dsave()">
        ${isAdd?`<button class="btn subtle" style="margin-top:9px" onclick="removeFromDay(${i})">－ 이 회차에서 빼기 (다음 바퀴부터 제외)</button>`:''}`;
    }
    const isAddH=((m.dayAdds||{})[draft.dayIdx]||[]).includes(en.exId);
    return `<div class="card" ${en.open?'style="border-color:var(--blue)"':''}>
      <div class="exhead" onclick="togOpen(${i})"><span><b>${esc(exName(en.exId))}</b>${isAddH?' <span class="pill">퍼스널</span>':''}</span>${peek}</div>${body}</div>`;
  }).join('');
  const editing=!!draft.editLogId;
  return `<div class="top"><button class="back" onclick="leaveSession()">←</button>
    <h1>${editing?'기록 수정':esc(m.name)}${draft.dayIdx?' · A-'+draft.dayIdx:''}</h1><span class="muted num">${editing?fmtD(draft.editDate):doneCnt+'/'+draft.entries.length}</span></div>
    ${editing?`<div class="muted" style="margin:-8px 0 10px">${esc(m.name)} · ${fmtD(draft.editDate)} 수업을 수정하는 중</div>`
      : draft.lap>1?`<div class="muted" style="margin:-8px 0 10px">${draft.lap}바퀴째 — 지난 바퀴 기록과 비교하며 진행</div>`:''}
    ${draft.refDate?`<div class="card" style="border-color:var(--warn); padding:9px 13px"><b>📌 기준 수업 ${esc(fullD(draft.refDate))}</b><div class="muted">운동마다 그날 기록이 옆에 붙습니다 — 오늘 숫자를 적으면 변화가 바로 계산됩니다</div></div>`:''}
    <input class="cond" type="text" placeholder="🩺 오늘 컨디션 (예: 허리 불편감 · 수면 부족)" value="${esc(draft.cond)}" onchange="draft.cond=this.value; dsave()">
    ${cards}
    <div class="grid2">
      <button class="btn ghost" onclick="photoFill()">📷 사진으로 채우기</button>
      <button class="btn ghost" onclick="addExerciseToday()">＋ 퍼스널 운동</button></div>
    <button class="btn" onclick="finishSession()">${editing?'수정 저장':'수업 완료'}</button>
    ${editing?'<button class="btn danger" onclick="deleteLog()">이 수업 기록 삭제</button>':''}`;
}
function addSet(i){ const en=draft.entries[i]; en.sets.push(newSet(en.mode, en.sets[en.sets.length-1])); dsave(); render(); }
function delSet(i,si){ const en=draft.entries[i]; en.sets.splice(si,1); if(!en.sets.length)en.sets.push(newSet(en.mode)); dsave(); render(); }
function togIssue(i,p){ const a=draft.entries[i].issues; const x=a.indexOf(p); x<0?a.push(p):a.splice(x,1); dsave(); render(); }
function togOpen(i){ draft.entries[i].open=!draft.entries[i].open; dsave(); render(); }
function loadPrev(i){
  const en=draft.entries[i];
  const prev=cmpPrev(draft, en.exId);
  if(!prev){ toast('불러올 기록이 없습니다'); return; }
  if(en.mode==='chk'){ en.chk=true; }
  else en.sets=validSets(prev.e.sets,en.mode).map(s=>({...s}));
  dsave(); render(); toast('지난 기록을 불러왔습니다 — 숫자만 고치세요');
}
function addExerciseToday(){
  pickExercise(exId=>{
    if(draft.entries.some(e=>e.exId===exId)){ toast('이미 목록에 있는 운동입니다'); return; }
    const mode=exMode(exId);
    draft.entries.push({exId, mode, sets:mode==='chk'?[]:[newSet(mode)], chk:false, issues:[], memo:'', open:true});
    const m=db.members.find(x=>x.id===draft.memberId);
    m.dayAdds=m.dayAdds||{}; const a=m.dayAdds[draft.dayIdx]=m.dayAdds[draft.dayIdx]||[];
    if(!a.includes(exId)) a.push(exId);
    dsave(); render(); toast('퍼스널 운동으로 추가 — 다음 바퀴 이 회차에도 나옵니다'); });
}
function removeFromDay(i){
  const en=draft.entries[i];
  ask(exName(en.exId)+' 운동을 이 회차에서 뺄까요?\n(다음 바퀴부터 나오지 않습니다)', '빼기', ()=>{
    const m=db.members.find(x=>x.id===draft.memberId);
    if(m.dayAdds&&m.dayAdds[draft.dayIdx]) m.dayAdds[draft.dayIdx]=m.dayAdds[draft.dayIdx].filter(id=>id!==en.exId);
    draft.entries.splice(i,1); dsave(); render(); toast('뺐습니다'); });
}
function leaveSession(){ const id=draft.memberId; go({name:'member', id}); toast('입력 내용은 자동 저장돼 있습니다'); }
function finishSession(){
  const entries=draft.entries.map(en=>({exId:en.exId, chk:en.mode==='chk'?en.chk:undefined,
    sets:en.mode==='chk'?[]:validSets(en.sets,en.mode).map(s=>{
      const o={}; for(const k in s){ o[k]= (k==='band')? s[k] : num(s[k]); } return o; }),
    issues:en.issues, memo:en.memo.trim()}))
    .filter(en=>en.sets.length||en.chk||en.issues.length||en.memo);
  if(!entries.length){ toast('기록된 내용이 없습니다'); return; }
  const m=db.members.find(x=>x.id===draft.memberId);
  /* 지난 기록 수정 모드 — 기존 로그를 덮어쓰고 끝 */
  if(draft.editLogId){
    const log=db.logs.find(l=>l.id===draft.editLogId);
    if(log){ log.entries=entries; log.cond=draft.cond.trim(); }
    const mid=draft.memberId; draft=null; db.draft=null; save();
    go({name:'logs', id:mid}); toast('수정됐습니다'); return;
  }
  const log={id:uid(), memberId:draft.memberId, dayIdx:draft.dayIdx, lap:draft.lap, date:today(),
    cond:draft.cond.trim(), progId:m.programId, entries};
  if(draft.refLogId){ log.refLogId=draft.refLogId; log.refDate=draft.refDate; }
  db.logs.push(log);
  m.sessionsDone=(m.sessionsDone||0)+1;
  /* 오늘 이 회원의 예약이 있으면 자동으로 「완료」 표시 */
  const bk=db.bookings.find(b=>b.memberId===m.id && b.date===today() && !b.status);
  if(bk) bk.status='done';
  draft=null; db.draft=null;
  save(); const lid=log.id; go({name:'summary', logId:lid});
}

/* ───────────────────── 수업지 인쇄 (A4 한 장) ─────────────────────
   폰을 안 보고 종이로 수업하기 위한 서식. 지난 기록은 인쇄돼 나오고 오늘 기록 칸만 비어 있다.
   회원 실명 대신 이니셜만 찍는다 — 사진 판독을 무료 AI로 돌릴 때 개인정보가 안 나가게. */
function maskName(n){ n=(n||'').replace(' (예시)','').trim(); return n? n[0]+'OO':''; }
function printSheet(memberId, refLogId){
  const m=db.members.find(x=>x.id===memberId); if(!m) return;
  if(!refLogId && draft && draft.memberId===memberId && draft.refLogId) refLogId=draft.refLogId;
  const ref=refLogId? db.logs.find(l=>l.id===refLogId) : null;
  const pr=memberProgress(m);
  if(!pr && !ref){ toast('배정된 프로그램이 없습니다 — 「기준 수업 불러오기」에서 인쇄하세요'); return; }
  const dayIdx=pr? ((draft&&draft.memberId===memberId&&!draft.editLogId)? draft.dayIdx : pr.nextDay) : 0;
  let items;
  if(ref) items=[...new Set((ref.entries||[]).map(e=>e.exId))].filter(id=>exOf(id));
  else{
    const day=pr.p.days[dayIdx-1]||{items:[]};
    const adds=((m.dayAdds||{})[dayIdx]||[]).filter(id=>!day.items.includes(id)&&exOf(id));
    items=[...day.items,...adds];
  }
  const ctx={memberId, dayIdx, lap:pr?pr.lap:0, progId:m.programId, refLogId:ref?ref.id:null};
  if(!items.length){ toast('이 회차에 운동이 없습니다'); return; }
  const bx='<span class="bx">&nbsp;</span>';
  const rows=items.map((exId,i)=>{
    const mode=exMode(exId);
    const prev=cmpPrev(ctx, exId);
    let pv='첫 기록';
    if(prev){
      pv=(mode==='chk'?'✓ 완료':compactStr(prev.e,mode))||'—';
      const iss=[...(prev.e.issues||[]), prev.e.memo].filter(Boolean).join(', ');
      if(iss) pv+=' · ⚠'+iss;
    }
    let cells='';
    if(mode==='chk') cells='완료 □';
    else if(mode==='t') cells=Array(3).fill(bx+' 초').join(' &nbsp;·&nbsp; ');
    else if(mode==='lv') cells=Array(3).fill('Lv'+bx+' × '+bx).join(' &nbsp;·&nbsp; ');
    else if(mode==='band') cells=Array(3).fill(bx+' 밴드 × '+bx).join(' &nbsp;·&nbsp; ');
    else cells=Array(5).fill(bx+'kg × '+bx).join(' &nbsp;·&nbsp; ');
    return `<tr><td class="exn">${i+1}. ${esc(exName(exId))}<div class="prv">${ref?'기준':'지난'}: ${esc(pv)}</div></td>
      <td><div class="cells">${cells}</div>
      <div class="prv" style="margin-top:5px">특이사항: ________________________________________</div></td></tr>`;
  }).join('');
  document.getElementById('printsheet').innerHTML=`
    <div class="ph"><b>수업일지 · ${esc(maskName(m.name))}${m.sex?` (${m.sex})`:''}</b>
      <span class="r">${ref?`<b>📌 기준 수업 ${esc(fullD(ref.date))}</b>`:`${esc(pr.p.name)} · <b>A-${dayIdx}</b> · ${pr.lap}바퀴째`}</span></div>
    <div class="cline">날짜: ________________ &nbsp;&nbsp;&nbsp; 컨디션: ____________________________________________</div>
    <table><tr><th style="width:36%">운동 (${ref?'기준 수업 기록':'지난 기록'})</th><th>오늘 기록 — 밑줄 위에 숫자만 적으세요</th></tr>${rows}</table>
    <div class="foot">허봇스 수업일지 · 수업 후 앱의 「📷 사진으로 채우기」로 이 종이를 찍으면 자동 입력됩니다</div>`;
  window.print();
}

/* ───────────────────── AI 사진 판독 한도 (2026-10-15 대표님 결정) ─────────────────────
   기록은 평생 무료. AI 사진 판독(수업지·인바디)만 한 달 10장 무료, 그 이상은 멤버십.
   세는 건 서버(ocr 함수)가 한다 — 앱은 남은 장수를 보여주고, 막히면 안내만. */
let ocrQuota=null;   /* {used, limit, left, member, admin} */
/* 변화 리포트 카톡 공유는 멤버십 기능 — 멤버십 판매(토스 카드사 심사 뒤)가 열리면 true 로 바꾼다 */
const MEMBERSHIP_OPEN=false;
async function ocrCall(body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(SB_URL+'/functions/v1/ocr',{method:'POST',
    headers:{'content-type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(session?session.access_token:SB_KEY)},
    body:JSON.stringify(body)});
  let out={}; try{ out=await res.json(); }catch(e){}
  if(out && out._quota){ ocrQuota={...(ocrQuota||{}), used:out._quota.used, limit:out._quota.limit, left:Math.max(0,out._quota.limit-out._quota.used)}; delete out._quota; }
  if(res.status===402 && out && out.error==='limit'){ ocrQuota=out; return {limit:true}; }
  return {res, out};
}
async function loadOcrQuota(){
  if(!user||!sb) return;
  try{ const r=await ocrCall({mode:'status'}); if(r.res&&r.res.ok&&r.out&&r.out.limit) ocrQuota=r.out; }catch(e){}
}
function ocrUnlimited(){ return !!(ocrQuota&&(ocrQuota.member||ocrQuota.admin)); }
function ocrLeftText(){
  if(!ocrQuota) return '';
  if(ocrUnlimited()) return ocrQuota.admin? '사진 판독 무제한 (관리자)' : '사진 판독 무제한 (멤버십)';
  return `이번 달 무료 사진 판독 <b>${ocrQuota.left??Math.max(0,ocrQuota.limit-ocrQuota.used)}장</b> 남음 (한 달 ${ocrQuota.limit}장)`;
}
function ocrLimitModal(){
  modal(`<b>이번 달 무료 사진 판독 ${ocrQuota&&ocrQuota.limit||10}장을 다 쓰셨어요</b>
    <div class="muted" style="margin:10px 0 0;line-height:1.7">기록은 지금처럼 <b>직접 입력으로 계속 무료</b>입니다. 사진 판독은 다음 달 1일에 다시 ${ocrQuota&&ocrQuota.limit||10}장이 채워져요.<br>
    ${MEMBERSHIP_OPEN?'사진 판독을 제한 없이 쓰려면 허봇스 멤버십을 이용해 주세요.':'제한 없이 쓰는 허봇스 멤버십은 곧 열립니다.'}</div>
    <button class="btn" style="margin-top:14px" onclick="closeModal()">알겠어요</button>`);
}
function ocrBlocked(){ return !!(ocrQuota && !ocrUnlimited() && (ocrQuota.used>=ocrQuota.limit)); }

/* ───────────────────── 사진 판독 — 종이 일지를 찍으면 오늘 기록이 채워진다 ─────────────────────
   사진은 서버(Supabase 함수)를 거쳐 무료 AI(Gemini)가 읽는다. 결과는 반드시 확인 후 저장. */
async function photoFill(){
  if(!draft){ toast('수업 화면에서만 쓸 수 있습니다'); return; }
  if(typeof locked==='function' && locked()){ blockEdit(); return; }
  if(!user||!sb){ toast('로그인 상태에서만 쓸 수 있습니다'); return; }
  if(ocrBlocked()){ ocrLimitModal(); return; }
  modal(`<b>📷 어떤 종이인가요?</b>
    ${ocrQuota?`<div class="muted" style="margin:4px 0 0">${ocrLeftText()}</div>`:''}
    <div class="muted" style="margin:4px 0 10px">8칸 수업지면 이 수업이 몇 번째 칸인지 골라 주세요 (왼쪽 열 위→아래 1~4, 오른쪽 열 5~8)</div>
    <div class="grid2" style="grid-template-columns:repeat(4,1fr)">${[1,2,3,4,5,6,7,8].map(n=>`<button class="btn subtle" onclick="window.__ocrCell=${n}; closeModal(); document.getElementById('ocr-file').click()">${n}번 칸</button>`).join('')}</div>
    <button class="btn ghost" onclick="window.__ocrCell=0; closeModal(); document.getElementById('ocr-file').click()">한 장에 한 수업짜리 종이</button>`);

document.addEventListener('DOMContentLoaded', ()=>{
  const inp=document.getElementById('ocr-file'); if(!inp) return;
  inp.addEventListener('change', async function(){
    const file=this.files&&this.files[0]; this.value='';
    if(!file||!draft) return;
    modal('<b>🔍 사진을 읽는 중…</b><div class="muted" style="margin-top:8px">10초쯤 걸립니다. 화면을 닫지 마세요.</div>');
    try{
      const b64=await shrinkImage(file, 1400, .82);
      const exList=draft.entries.map(en=>({name:exName(en.exId), mode:en.mode}));
      const r=await ocrCall({image:b64, mime:'image/jpeg', exercises:exList, cell:window.__ocrCell||0,
          issues:ISSUE_SETS.flatMap(g=>g.items), bands:BANDS});
      if(r.limit){ ocrLimitModal(); return; }
      const {res,out}=r;
      if(res.status===404){ closeModal(); toast('판독 서버가 아직 설치되지 않았습니다'); return; }
      if(!res.ok||out.error) throw new Error('서버 '+res.status+' '+(out.error||''));
      applyOcr(out);
      if(ocrQuota&&!ocrUnlimited()) toast(`이번 달 무료 판독 ${ocrQuota.left}장 남았습니다`);
    }catch(e){ closeModal(); toast('판독 실패 — 밝은 곳에서 똑바로 다시 찍어보세요'); console.error(e); }
  });
});
function shrinkImage(file, maxPx, q){
  return new Promise((ok,no)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const sc=Math.min(1, maxPx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL('image/jpeg',q); URL.revokeObjectURL(img.src); ok(d.split(',')[1]);
    }catch(e){ no(e); } };
    img.onerror=no; img.src=URL.createObjectURL(file);
  });
}
function applyOcr(out){
  if(!draft){ closeModal(); return; }
  const KNOWN=ISSUE_SETS.flatMap(g=>g.items);
  let filled=0;
  (out.entries||[]).forEach((oe,i)=>{
    const en=draft.entries[i]; if(!en||!oe) return;
    if(en.mode==='chk'){ if(oe.chk){ en.chk=true; filled++; } }
    else{
      const sets=(oe.sets||[]).map(s=>{
        if(en.mode==='t') return {sec:String(s.sec??'')};
        if(en.mode==='lv') return {lv:String(s.lv??''), n:String(s.n??s.r??'')};
        if(en.mode==='band') return {band:BANDS.includes(s.band)?s.band:BANDS[0], r:String(s.r??'')};
        return {w:String(s.w??''), r:String(s.r??'')};
      }).filter(s=> en.mode==='t'? s.sec!=='' : en.mode==='lv'? s.n!=='' : s.r!=='');
      if(sets.length){ en.sets=sets; filled++; }
    }
    const iss=(oe.issues||[]).filter(x=>KNOWN.includes(x));
    iss.forEach(x=>{ if(!en.issues.includes(x)) en.issues.push(x); });
    const extra=(oe.issues||[]).filter(x=>!KNOWN.includes(x)).join(', ');
    const memo=[oe.memo, extra].filter(Boolean).join(', ').trim();
    if(memo) en.memo=en.memo? en.memo+', '+memo : memo;
  });
  if(out.cond && !draft.cond) draft.cond=String(out.cond);
  dsave(); closeModal(); render();
  toast(filled? `판독 완료 — ${filled}개 운동을 채웠습니다. 숫자 확인 후 저장하세요` : '읽을 기록을 못 찾았습니다 — 사진을 더 밝고 똑바로 찍어보세요');
}

/* ───────────────────── 한 바퀴 전 자동 기준 · 8칸 수업지 ─────────────────────
   대표님 방식: 30회(또는 10회) 한 바퀴를 돌면, 다음 수업의 기준 = 한 바퀴 전 같은 순번 수업.
   1/1(1회차)…1/30(30회차) 다음 1/31 수업의 기준은 1/1, 그다음은 1/2. 종이는 A4 한 장에 8칸. */
function memberLogs(m){ return db.logs.filter(l=>l.memberId===m.id).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||((a.id>b.id)?1:-1)); }
/* 바퀴 길이: 직접 정했으면 그 값, 아니면 가장 최근 「기준 수업」이 몇 회 전이었는지를 이어 간다
   (종이 모서리 날짜가 3.11이었으면 다음 수업은 그다음 날인 3.23 — 대표님 실제 일지 방식), 그것도 없으면 30. */
function cycleInfo(m){
  if(+m.cycle) return {n:+m.cycle, auto:false};
  const L=memberLogs(m);
  for(let i=L.length-1;i>=0;i--){ const r=L[i].refLogId; if(!r) continue;
    const j=L.findIndex(l=>l.id===r); const g=i-j;
    if(j>=0 && g>=5 && g<=120) return {n:g, auto:true}; }
  return {n:30, auto:false};
}
function cycleOf(m){ return cycleInfo(m).n; }
function autoRef(m, ahead){
  const L=memberLogs(m), cyc=cycleOf(m), n=L.length;
  if(n<cyc) return null;
  const idx=n-cyc+((ahead||0)%cyc);
  return L[idx]||null;
}
function cycleCard(m){
  const L=memberLogs(m), ci=cycleInfo(m), cyc=ci.n, n=L.length;
  const going=draft&&draft.memberId===m.id;
  const ref=autoRef(m,0);
  return `<div class="card">
      <div class="row"><b>자유 순서 수업 · 한 바퀴 ${cyc}회${ci.auto?' <span class="muted" style="font-weight:400">(마지막 기준 따라감)</span>':''}</b><button class="ichip" onclick="openCycle('${m.id}')">바퀴 길이 바꾸기</button></div>
      <div class="muted">지금까지 <span class="num">${n}</span>회 · 다음은 <b class="num">${n+1}</b>번째 수업
        ${ref?` · 자동 기준 <b style="color:var(--warn)">${fullD(ref.date)}</b> (한 바퀴 전 ${n+1-cyc}번째)`:` · 첫 바퀴 진행 중 (${cyc-n}회 남음)`}</div></div>
    ${going?`<button class="btn" onclick="go({name:'session'})">▶ 수업 이어하기 (자동 저장됨)</button>
        <button class="btn subtle" onclick="discardDraft()">진행 중 입력 버리기</button>`
      : ref?`<button class="btn" onclick="startRefSession('${m.id}','${ref.id}')">▶ 다음 수업 시작 — 📌 기준 ${fullD(ref.date)}</button>`
      : `<div class="muted" style="margin:4px 0 8px">첫 바퀴가 끝나기 전에는 「📌 기준 수업 불러오기」로 비교할 날을 직접 고르세요.</div>`}
    ${ref?`<button class="btn ghost" onclick="go({name:'peek', id:'${m.id}', k:0})">📋 오늘 수업 보기 — 종이에 옮겨 적기용</button>
    <button class="btn ghost" onclick="printSheet8('${m.id}')">🖨 다음 8회 수업지 인쇄 — 종이로 수업하기</button>`:''}`;
}
function openCycle(memberId){
  const m=db.members.find(x=>x.id===memberId);
  modal(`<b>한 바퀴 길이</b><div class="muted" style="margin:4px 0 10px">몇 회를 한 바퀴로 돌리나요? 다음 수업의 기준이 이만큼 앞 수업으로 자동으로 잡힙니다.</div>
    <button class="btn ${+m.cycle?'subtle':''}" onclick="setCycle('${memberId}',0)">자동 — 마지막으로 쓴 기준 날짜를 이어 가기</button>
    <div class="grid2">${[10,20,30,40].map(n=>`<button class="btn ${+m.cycle===n?'':'subtle'}" onclick="setCycle('${memberId}',${n})">${n}회</button>`).join('')}</div>`);
}
function setCycle(memberId,n){ const m=db.members.find(x=>x.id===memberId); if(n) m.cycle=n; else delete m.cycle; save(); closeModal(); render(); toast(n?`한 바퀴 ${n}회로 바꿨습니다`:'마지막 기준을 이어 가도록 바꿨습니다'); }
/* 종이 일지를 옮길 때 붙인 판독 표시(원문·판독?·기록 없음·미기재·칸 설명)는 빼고 대표님 손글씨만 남긴다.
   빨간 펜(🔴)과 통증·주의 칩만 「진짜 특이사항」 — ⚠ 는 거기에만 붙인다. */
function memoParts(t){
  t=(t||'').replace(/\r?\n/g,' ').replace(/\([^()]*판독[^()]*\)/g,'').replace(/\(\?\)/g,'').trim();
  const warn=[], note=[]; if(!t) return {warn, note};
  for(let g of t.split(/\s+\/\s+|\s+—\s+|\s+·\s+|\.\s+|;\s+|\s*<\s*|\s*>\s*/)){
    g=g.trim(); if(!g) continue;
    if(/^원문/.test(g)){
      const q=[...g.matchAll(/[「'‘"“]([^」'’"”]*)[」'’"”]/g)].map(x=>x[1]);
      const pool=q.length? q : g.replace(/^원문\s*/,'').split(/,\s*/).slice(1);
      g=pool.filter(x=>/[가-힣]/.test(x)).join(', ');
      if(!g) continue;
    }
    if(/판독|칸\s*(위|밖|아래)|사선|덧씀/.test(g)) continue;
    g=g.replace(/((수치|횟수|무게|세트\s*수|기록)\s*)?미기재(\([^)]*\)?)?/g,'').replace(/((오늘|수치)\s*)?기록\s*없음\.?/g,'')
       .replace(/메모\s*[「'‘"“]([^」'’"”]*)[」'’"”]/g,'$1').replace(/[「」'‘’"“”]/g,'').replace(/\s*메모$/,'')
       .replace(/본줄\s*|옆\s*초록\s*|\((초록|파랑|검정)\)\s*/g,'').replace(/\([^)]*$/,'').replace(/\(\s*\)/g,'')
       .replace(/\s{2,}/g,' ').replace(/^[\s,.·—\-:+]+|[\s,.·—\-:]+$/g,'');
    if(!g || /^\(.*\)$/.test(g)) continue;
    if(/🔴/.test(g)){ g=g.replace(/🔴\s*/g,'').trim(); if(g) warn.push(g); }
    else note.push(g);
  }
  return {warn, note};
}
/* 수업지 기록 한 줄: 최고 무게×횟수가 메인. 더 가벼워도 횟수가 확 많은 세트(일부러 한 근지구력)는 같이 */
function sheetRec(e, mode){
  if(mode==='chk') return e.chk?'✓':'';
  if(mode==='w'){
    const bw=bestW(e.sets), br=bestR(e.sets);
    if(!bw) return br? setStr(br).replace(/kg/g,'') : '';
    let v=setStr(bw).replace(/kg/g,'');
    if(br && br!==bw && num(br.r)>=num(bw.r)*1.5 && num(br.r)-num(bw.r)>=5) v+=' · 지구력 '+setStr(br).replace(/kg/g,'');
    return v;
  }
  return compactStr(e,mode)||'';
}
/* 기준 수업에 그 운동 기록이 없으면 → 그 회원의 전체 기록 중 최고로 채운다 (2026-10-15 대표님 지시)
   최고 = 무게 운동은 최고 무게(같으면 횟수 많은 것), 시간은 최장, 레벨은 최고 레벨, 밴드·체크는 가장 최근 */
function bestEver(memberId, exId){
  const mode=exMode(exId); let best=null, bs=-1;
  db.logs.filter(l=>l.memberId===memberId).forEach(l=>(l.entries||[]).forEach(e=>{
    if(e.exId!==exId) return;
    let sc=-1;
    if(mode==='w'){ const bw=bestW(e.sets), br=bestR(e.sets); sc= bw? num(bw.w)*1e4+num(bw.r) : br? num(br.r) : -1; }
    else if(mode==='t'){ const t=bestT(e.sets); sc=t||-1; }
    else if(mode==='lv'){ const b=bestLv(e.sets); sc=b? num(b.lv)*1e4+num(b.n) : -1; }
    else if(mode==='band'){ sc= lastBand(e.sets)? Date.parse(l.date||0)||0 : -1; }
    else if(mode==='chk'){ sc= (e.chk || (e.memo||'').trim() || (e.sets||[]).length)? Date.parse(l.date||0)||0 : -1; }
    if(sc>bs || (sc===bs && sc>=0 && best && (l.date||'')>(best.date||''))){ bs=sc; best={e, date:l.date}; }
  }));
  return bs>=0? best : null;
}
function shortD(d){ const p=(d||'').split('-'); return p.length===3? `${p[0].slice(2)}.${+p[1]}.${+p[2]}` : ''; }
/* 항상 같이 보여 줄 「전체 최고 + 날짜」 — 모든 운동에 날짜를 붙인다 (10-15 대표님 지시)
   무게·시간·레벨 = 최고 기록, 밴드 = 가장 최근 기록, 체크만 하는 운동 = 마지막으로 한 날 */
function bestTxt(memberId, exId){
  const mode=exMode(exId); if(!memberId) return null;
  const b=bestEver(memberId, exId); if(!b) return null;
  if(mode==='chk') return {rec:'', date:b.date, e:b.e, kind:'last'};
  const r=sheetRec(b.e, mode); if(!r) return null;
  return {rec:r+(b.e.unsureNum?'?':''), date:b.date, e:b.e, kind: mode==='band'?'recent':'best'};
}
function bestWord(b){ return b.kind==='last'? '마지막으로 한 날' : b.kind==='recent'? '최근' : '최고'; }
function sheetLine(exId, e, isRef){
  const mode=exMode(exId);
  let rec, warn=[], note=[];
  if(e){
    rec=sheetRec(e,mode);
    if(rec && e.unsureNum) rec+='?';
    const mp=memoParts(e.memo);
    warn=[...(e.issues||[]), ...mp.warn]; note=mp.note;
  }
  const best=bestTxt(_sheetMember, exId);
  if(best){
    const w= best.kind==='last'? '마지막' : bestWord(best);
    if(best.kind==='last' || (rec && best.e===e)) rec=(rec? rec+' · ' : '')+`${w}(${shortD(best.date)})`;
    else rec=(rec? rec+' · ' : '')+`${w} ${best.rec}(${shortD(best.date)})`;
  }
  if(!rec && !e) rec= isRef? '' : '첫 기록';
  const sub=[warn.length?`<b>⚠ ${esc(warn.join(' / '))}</b>`:'', note.length? esc(note.join(' / ')) :''].filter(Boolean).join(' &nbsp;');
  const len=(warn.join(' / ')+' '+note.join(' / ')).trim().length;
  return {html:`<div class="ln"><b>${esc(exName(exId))}</b> ${rec?`<sup>${esc(rec)}</sup>`:''} :</div>${sub?`<div class="nt">${sub}</div>`:''}`,
    rows:1+(sub? Math.ceil(len/52) : 0)};
}
/* 다음 수업들(최대 8회) — 인쇄용 수업지와 「오늘 수업 보기」가 같은 기준을 쓴다 */
function nextCells(m, startRefId){
  const memberId=m.id, pr=memberProgress(m), L=memberLogs(m), cells=[];
  if(startRefId){
    const j=L.findIndex(l=>l.id===startRefId);
    for(let i=0;i<8 && j+i<L.length;i++){ const r=L[j+i]; cells.push({ref:r, items:[...new Set((r.entries||[]).map(e=>e.exId))].filter(id=>exOf(id)), ctx:{memberId, refLogId:r.id}}); }
  } else if(pr){
    for(let i=0;i<8;i++){
      const d=((pr.nextDay-1+i)%pr.total)+1, lap=pr.lap+Math.floor((pr.nextDay-1+i)/pr.total);
      const day=pr.p.days[d-1]||{items:[]};
      const adds=((m.dayAdds||{})[d]||[]).filter(id=>!day.items.includes(id)&&exOf(id));
      cells.push({label:'A-'+d, items:[...day.items,...adds], ctx:{memberId, dayIdx:d, lap, progId:m.programId}});
    }
  } else {
    for(let i=0;i<8;i++){ const r=autoRef(m,i); if(!r) break;
      cells.push({ref:r, items:[...new Set((r.entries||[]).map(e=>e.exId))].filter(id=>exOf(id)), ctx:{memberId, refLogId:r.id}}); }
  }
  return cells;
}
let _sheetMember=null;
function printSheet8(memberId, startRefId){
  const m=db.members.find(x=>x.id===memberId); if(!m) return;
  _sheetMember=memberId;
  const L=memberLogs(m), cells=nextCells(m, startRefId);
  if(!cells.length){ toast('뽑을 수업이 없습니다 — 첫 바퀴 중이면 「📌 기준 수업 불러오기」에서 날짜를 골라 인쇄하세요'); return; }
  const n0=L.length+1;
  const html=cells.map((c,i)=>{
    let rows=0;
    const lines=c.items.map(exId=>{
      const p=c.ref? refPrev(c.ref.id, exId) : cmpPrev(c.ctx, exId);
      const L1=sheetLine(exId, p&&p.e, !!c.ref); rows+=L1.rows; return L1.html;
    });
    const pad=Math.max(0, 9-rows);
    for(let k=0;k<pad;k++) lines.push('<div class="ln blank">.</div>');
    const rf=c.ref? `📌 ${(+c.ref.date.slice(5,7))}.${(+c.ref.date.slice(8,10))}` : c.label;
    return `<div class="c8 ${rows>16?'xs':rows>11?'sm':''}"><div class="hd"><span>${n0+i}회 · 날짜: ______</span><span>컨디션: __________</span><span class="rf">${rf}</span></div>${lines.join('')}</div>`;
  }).join('');
  const blanks=Array(Math.max(0,8-cells.length)).fill('<div class="c8"></div>').join('');
  document.getElementById('printsheet').innerHTML=`
    <div class="s8h"><b>수업일지 · ${esc(maskName(m.name))}${m.sex?` (${m.sex})`:''}</b>
      <span>${n0}~${n0+cells.length-1}회차 · 📌 = 기준 수업 날짜 · 작은 숫자 = 기준일 최고 무게×횟수 · 「최고」 = 전체 기록 중 최고와 그 날짜(체크 운동은 마지막으로 한 날) · ⚠ = 통증·주의 · ? = 확정 못 한 숫자</span></div>
    <div class="g8">${html}${blanks}</div>
    <div class="foot">허봇스 수업일지 · 칸 순서: 왼쪽 열 위→아래(1~4), 오른쪽 열(5~8) · 수업 후 「📷 사진으로 채우기」에서 칸 번호를 고르면 자동 입력</div>`;
  window.print();
}

/* ── 📋 오늘 수업 보기 (2026-10-15) — 출력이 어려운 선생님이 화면을 보고 종이에 옮겨 적는 용도. 입력 칸 없음 ── */
function peekLine(exId, e, isRef, memberId){
  const mode=exMode(exId);
  let rec='', warn=[], note=[], from='';
  if(e){
    rec=sheetRec(e,mode); if(rec && e.unsureNum) rec+='?';
    const mp=memoParts(e.memo); warn=[...(e.issues||[]), ...mp.warn]; note=mp.note;
  }
  const best=bestTxt(memberId, exId);
  /* 기준일에 숫자가 없으면 옮겨 적을 자리(파란 숫자)에 바로 최고 기록을 넣는다 */
  if(!rec && best && best.kind!=='last'){
    return `<div class="pk-row"><div class="pk-top"><div class="pk-ex">${esc(exName(exId))}</div><div class="pk-rec num">${esc(best.rec)}</div></div>
      <div class="pk-best">🏆 ${bestWord(best)} 기록 · ${fullD(best.date)} <span class="muted">(${isRef?'기준일':'지난 수업'}엔 숫자 없음)</span></div>
      ${warn.length?`<div class="pk-warn">⚠ ${esc(warn.join(' / '))}</div>`:''}
      ${note.length?`<div class="pk-note">${esc(note.join(' / '))}</div>`:''}</div>`;
  }
  const recHtml= rec? `<div class="pk-rec num">${esc(rec)}</div>`
    : `<div class="pk-rec none">${e? '기록 없음' : isRef? '기록 없음' : '첫 기록'}</div>`;
  from= !best? '' : best.kind==='last'? `<div class="pk-best">🕘 마지막으로 한 날 · ${fullD(best.date)}</div>`
    : (rec && best.e===e)? `<div class="pk-best">🏆 이 날이 ${bestWord(best)} 기록 · ${fullD(best.date)}</div>`
    : `<div class="pk-best">🏆 ${bestWord(best)} <b class="num">${esc(best.rec)}</b> · ${fullD(best.date)}</div>`;
  return `<div class="pk-row"><div class="pk-top"><div class="pk-ex">${esc(exName(exId))}</div>${recHtml}</div>${from}
    ${warn.length?`<div class="pk-warn">⚠ ${esc(warn.join(' / '))}</div>`:''}
    ${note.length?`<div class="pk-note">${esc(note.join(' / '))}</div>`:''}</div>`;
}

/* ───────────────────── 인바디 — 측정 기록·추이·변화 ─────────────────────
   member.inbody = [{date, weight, smm(골격근), fat_kg, fat_pct, bmi, score, visceral, whr, bmr, memo}] */
const IB_F=[
  ['weight','체중','kg',0], ['smm','골격근량','kg',1], ['fat_kg','체지방량','kg',-1], ['fat_pct','체지방률','%',-1],
  ['score','인바디 점수','점',1], ['visceral','내장지방 레벨','',-1], ['bmi','BMI','',0], ['whr','복부지방률','',-1], ['bmr','기초대사량','kcal',1]];
function ibSorted(m){ return (m.inbody||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')); }
function ibNum(v){ return (v===''||v===null||v===undefined||isNaN(+v))? null : +v; }
function ibDelta(key,a,b,good){
  const x=ibNum(a), y=ibNum(b); if(x===null||y===null) return '';
  const d=Math.round((y-x)*10)/10; if(!d) return '<span class="muted">변화 없음</span>';
  const cls= good===0? '' : ((d>0)===(good>0)? 'good':'warn');
  return `<span class="pill ${cls}">${d>0?'+':''}${d}</span>`;
}
function ibSpark(list,key,good){
  const pts=list.map(r=>ibNum(r[key])).filter(v=>v!==null); if(pts.length<2) return '';
  const lo=Math.min(...pts), hi=Math.max(...pts), W=280, H=44, pad=4, span=(hi-lo)||1;
  const xy=pts.map((v,i)=>[pad+i*(W-2*pad)/(pts.length-1), H-pad-(v-lo)/span*(H-2*pad)]);
  const last=xy[xy.length-1];
  const col= good>0? 'var(--good)' : good<0? 'var(--blue)' : 'var(--sub)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:44px; display:block">
    <polyline fill="none" stroke="${col}" stroke-width="2" points="${xy.map(p=>p.join(',')).join(' ')}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${col}"/></svg>`;
}
function ibReportLines(m){
  const L=ibSorted(m); if(L.length<2) return [];
  const a=L[0], b=L[L.length-1], out=[];
  [['smm','골격근','kg'],['fat_kg','체지방','kg'],['fat_pct','체지방률','%'],['visceral','내장지방 레벨',''],['score','인바디 점수','점']].forEach(([k,n,u])=>{
    const x=ibNum(a[k]), y=ibNum(b[k]); if(x===null||y===null) return;
    const d=Math.round((y-x)*10)/10;
    out.push(`${n} ${x}→${y}${u} (${d>0?'+':''}${d})`);
  });
  if(out.length) out.unshift(`${fullD(a.date)} → ${fullD(b.date)} · ${L.length}회 측정`);
  return out;
}
function ibReportHtml(m){
  const L=ibReportLines(m); if(!L.length) return '';
  return `<div class="muted" style="font-size:12px; margin-bottom:4px">${esc(L[0])}</div>`+
    L.slice(1).map(x=>`<div style="font-size:13.5px; margin-bottom:4px">⚖️ ${esc(x)}</div>`).join('');
}
function vInbody(){
  const m=db.members.find(x=>x.id===view.id); if(!m) return vHome();
  const L=ibSorted(m);
  const head=`<div class="top"><button class="back" onclick="go({name:'member', id:'${m.id}'})">←</button><h1>⚖️ ${esc(m.name)} 인바디</h1><span class="muted num">${L.length}회</span></div>`;
  const addBtn=`${ocrQuota?`<div class="muted" style="font-size:12.5px;margin:0 0 6px">${ocrLeftText()}</div>`:''}<button class="btn" onclick="ibPhoto('${m.id}')">📷 인바디 결과지 사진으로 넣기</button>
    <button class="btn subtle" onclick="openIbForm('${m.id}')">＋ 숫자로 직접 넣기</button>`;
  if(!L.length) return head+`<div class="empty">아직 인바디 기록이 없습니다.<br>결과지를 보고 숫자 몇 개만 넣으면 추이와 변화가 자동으로 나옵니다.</div>`+addBtn;
  const a=L[0], b=L[L.length-1];
  const rows=IB_F.filter(f=>['weight','smm','fat_kg','fat_pct','score','visceral'].includes(f[0])).map(([k,n,u,g])=>{
    const y=ibNum(b[k]); if(y===null) return '';
    return `<div class="row" style="padding:5px 0; border-bottom:1px solid var(--line)">
      <span>${n}</span><span><b class="num">${y}${u}</b> ${L.length>1?ibDelta(k,a[k],b[k],g):''}</span></div>`;
  }).join('');
  const charts=[['smm','골격근량 (kg)',1],['fat_kg','체지방량 (kg)',-1],['fat_pct','체지방률 (%)',-1],['weight','체중 (kg)',0]].map(([k,n,g])=>{
    const sp=ibSpark(L,k,g); if(!sp) return '';
    const v=L.map(r=>ibNum(r[k])).filter(x=>x!==null);
    return `<div style="margin-top:10px"><div class="row"><span class="muted">${n}</span><span class="muted num">최저 ${Math.min(...v)} · 최고 ${Math.max(...v)}</span></div>${sp}</div>`;
  }).join('');
  const list=L.slice().reverse().map(r=>`<div class="card tap" onclick="openIbForm('${m.id}','${r.date}')">
    <div class="row"><b class="num">${fullD(r.date)}</b><span class="muted num">점수 ${r.score??'-'}</span></div>
    <div class="muted num" style="margin-top:2px">체중 ${r.weight??'-'} · 골격근 ${r.smm??'-'} · 체지방 ${r.fat_kg??'-'}kg (${r.fat_pct??'-'}%) · 내장지방 ${r.visceral??'-'}</div>
    ${r.memo?`<div style="font-size:12.5px; margin-top:4px">📝 ${esc(r.memo)}</div>`:''}</div>`).join('');
  return head+`<div class="card"><b>${L.length>1?`첫 측정(${fullD(a.date)}) 대비 지금`:'최근 측정'}</b>
      <div class="muted" style="margin-bottom:4px">최근 ${fullD(b.date)}</div>${rows}${charts}</div>
    ${addBtn}
    <div class="muted" style="margin:12px 0 6px">측정 기록 — 누르면 고칠 수 있습니다</div>${list}`;
}

function saveIb(){
  const m=db.members.find(x=>x.id===_ibMember); if(!m) return;
  const g=k=>{ const el=document.getElementById('ib-'+k); return el? el.value.trim() : ''; };
  const date=g('date'); if(!date){ toast('측정일을 넣어 주세요'); return; }
  const prev=_ibDate? (m.inbody||[]).find(x=>x.date===_ibDate) : null;
  const r={...(prev||{}), date};
  ['weight','smm','fat_kg','fat_pct','score','visceral','bmi','bmr'].forEach(k=>{ const v=ibNum(g(k)); if(v!==null) r[k]=v; else delete r[k]; });
  const memo=g('memo'); if(memo) r.memo=memo; else delete r.memo;
  m.inbody=(m.inbody||[]).filter(x=>x.date!==_ibDate && x.date!==date);
  m.inbody.push(r); save(); closeModal(); render(); toast('인바디 기록을 저장했습니다');
}
function delIb(){

    const m=db.members.find(x=>x.id===_ibMember); m.inbody=(m.inbody||[]).filter(x=>x.date!==_ibDate);

}

/* ───────────────────── 기준 수업 — 지난 수업 하나를 골라 그날과 비교하며 수업 ─────────────────────
   대표님 종이 일지의 「모서리 날짜」를 앱으로 옮긴 것. 한 바퀴를 돌았거나 특이점이 있을 때
   지난 수업 아무 날이나 기준으로 잡고, 그날 운동·기록을 옆에 두고 오늘을 비교한다. */
function fullD(d){ return (d||'').replace(/-/g,'.'); }
function refPrev(refLogId, exId){
  const ref=db.logs.find(l=>l.id===refLogId); if(!ref) return null;
  const mode=exMode(exId);
  const e=(ref.entries||[]).find(x=>x.exId===exId && (mode==='chk'? x.chk : validSets(x.sets,mode).length || (x.issues||[]).length || x.memo));
  return e? {e, label:fullD(ref.date), samePos:true, isRef:true} : null;
}
function cmpPrev(ctx, exId){
  return (ctx.refLogId && refPrev(ctx.refLogId, exId)) || prevRecord(ctx.memberId, exId, ctx.dayIdx, ctx.lap, ctx.progId);
}
let _refMember=null;
function openRefPicker(memberId){

/* ───────────────────── 화면: 수업 요약 ───────────────────── */
function summaryData(log){
  const m=db.members.find(x=>x.id===log.memberId);
  const rows=log.entries.map(en=>{
    const mode=exMode(en.exId);
    const prev=cmpPrev(log, en.exId);
    let delta=null;
    if(mode==='w'){ const rm=e1rm(en.sets); if(rm&&prev){ const prm=e1rm(prev.e.sets); if(prm) delta=Math.round((rm.v-prm.v)/prm.v*100); } }
    if(mode==='t'){ const t=bestT(en.sets); if(t&&prev){ const pt=bestT(prev.e.sets); if(pt) delta=Math.round((t-pt)/pt*100); } }
    return {name:exName(en.exId), mode, en, delta};
  });
  const vol=log.entries.reduce((a,en)=>a+volume(en.sets),0);
  return {m, rows, vol};
}
function plainStr(en, mode){
  if(mode==='chk') return en.chk?'✓':'';
  if(mode==='t'){ const t=bestT(en.sets); return t? t+'초':''; }
  if(mode==='lv'){ const b=bestLv(en.sets); return b? 'Lv'+num(b.lv)+'×'+num(b.n):''; }
  if(mode==='band'){ const b=lastBand(en.sets); return b? b.band+' 밴드×'+num(b.r):''; }
  const bw=bestW(en.sets)||bestR(en.sets); return bw? setStr(bw):'';
}

/* ───────────────────── 화면: 변화 리포트 (재등록 상담용) ───────────────────── */
function reportData(m){
  const logs=db.logs.filter(l=>l.memberId===m.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!logs.length) return null;
  const byEx={};
  logs.forEach(l=>(l.entries||[]).forEach(e=>{ (byEx[e.exId]=byEx[e.exId]||[]).push({date:l.date, e}); }));
  const gains=[], times=[];
  for(const exId in byEx){
    const mode=exMode(exId); const arr=byEx[exId];
    if(mode==='w'){
      const rms=arr.map(x=>e1rm(x.e.sets)).filter(Boolean);
      if(rms.length>=2){ const f=rms[0].v, b=Math.max(...rms.map(x=>x.v));
        if(f>0&&b>f) gains.push({name:exName(exId), f, b, pct:Math.round((b-f)/f*100), unit:'kg'}); }
    }
    if(mode==='t'){
      const ts=arr.map(x=>bestT(x.e.sets)).filter(Boolean);
      if(ts.length>=2){ const f=ts[0], b=Math.max(...ts);
        if(b>f) times.push({name:exName(exId), f, b, pct:Math.round((b-f)/f*100), unit:'초'}); }
    }
  }
  gains.sort((a,b)=>b.pct-a.pct); times.sort((a,b)=>b.pct-a.pct);
  /* 파란 칩 — 어떤 운동에서 좋아졌는지 운동 이름과 함께 */
  const imps=[];
  logs.forEach(l=>(l.entries||[]).forEach(e=>(e.issues||[]).forEach(iss=>{
    if(issueCls(iss)==='imp') imps.push({ex:exName(e.exId), iss, date:l.date}); })));
  /* 빨간 칩 중 이후 수업에서 재발하지 않은 것 */
  const resolved=[];
  for(const exId in byEx){
    const arr=byEx[exId]; const lastIdx={};
    arr.forEach((x,idx)=>(x.e.issues||[]).forEach(iss=>{ if(issueCls(iss)==='bad') lastIdx[iss]=idx; }));
    for(const iss in lastIdx){ const after=arr.length-1-lastIdx[iss];
      if(after>=1) resolved.push({ex:exName(exId), iss, date:arr[lastIdx[iss]].date, after}); }
  }
  const vol=logs.reduce((a,l)=>a+(l.entries||[]).reduce((s,e)=>s+volume(e.sets),0),0);
  return {logs, first:logs[0].date, last:logs[logs.length-1].date, cnt:logs.length,
    gains:gains.slice(0,3), times, imps, resolved, vol};
}

      <div class="muted">수업 <span class="num">${r.cnt}</span>회 · 누적 볼륨 <span class="num">${r.vol.toLocaleString()}kg</span></div>
      ${sec('💪 근력 상승 TOP 3', gainsHtml)}
      ${sec('⏱ 시간 기록 성장', timesHtml)}
      ${sec('🔵 좋아진 것', impsHtml)}

  if(MEMBERSHIP_OPEN && !(ocrQuota&&(ocrQuota.member||ocrQuota.admin))){
